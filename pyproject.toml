# pyproject.toml — the gnomon workspace: Maxitor and its tools, built against AOA from the submodule external/aoa.
# The root is not a package of its own: it holds the workspace, the development tools and their settings.
[project]
name = "gnomon"
version = "0.0.0"
description = "The gnomon workspace: the Open Gnomon Protocol and Maxitor."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "@Bystrov.Maxim" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = ["maxitor[all]", "maxitor-plugin-sdk", "maxitor-plugin-template"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-xdist>=3.6,<4.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.4,<1.0",
    "pylint>=4.0,<5.0",
    "vulture>=2.11,<3.0",
    "radon>=6.0,<7.0",
    "taskipy>=1.12,<2.0",
    "httpx>=0.27,<1.0",
    "types-jsonschema>=4.19,<5",
    "types-PyYAML>=6.0,<7",
    "detect-secrets>=1.5,<2.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/maxitor", "packages/maxitor-plugin-sdk", "packages/maxitor-plugin-template"]

[tool.uv.sources]
maxitor = { workspace = true }
maxitor-plugin-sdk = { workspace = true }
maxitor-plugin-template = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--tb=short"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
    "benchmark: performance or load regression anchors (optional selective runs)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
exclude = "collect_python_files\\.py$"
mypy_path = "external/aoa/packages/aoa-action-machine/src:external/aoa/packages/aoa-fastapi-adapter/src:packages/maxitor/maxitor-core:packages/maxitor/maxitor-web:packages/maxitor/tools/repo-graph-port:packages/maxitor/tools/plugin-installer:packages/maxitor/tools/graph-builder:packages/maxitor/core/graph_compare:packages/maxitor/core/graph_map:packages/maxitor-plugin-sdk/src:packages/maxitor-plugin-template/src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# The core's drivers ship no types: asyncpg for its storage's errors, botocore for signing Postbox's requests.
module = ["asyncpg", "asyncpg.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "maxitor_notes.actions.*"
# AOA's state checkers (@result_string) are untyped decorators; an aspect under one is still checked by its own signature.
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = "maxitor.web.model.diagrams.*"
disable_error_code = ["valid-type"]

[tool.pylint.master]
load-plugins = ["pylint.extensions.docparams"]
jobs = 0
ignore-paths = ['.*/tests/.*', '.*/node_modules/.*', '^external/.*']

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0401",  # cyclic-import
    "R0901",  # too-many-ancestors — an action inherits its gate hosts by design
    "R0903",  # too-few-public-methods
    "R0801",  # duplicate-code
    "R0913",  # too-many-arguments
    "R0917",  # too-many-positional-arguments
    "R0902",  # too-many-instance-attributes
    "R0914",  # too-many-locals
    "R0904",  # too-many-public-methods
    "W0212",  # protected-access
    "W0511",  # fixme
    "W0107",  # unnecessary-pass
    "W0613",  # unused-argument
    "W0718",  # broad-exception-caught
    "C0103",  # invalid-name
    "C0301",  # line-too-long
    "W1404",  # implicit-str-concat
]

[tool.pylint.format]
max-line-length = 120
max-module-lines = 1500

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["packages", "tests", "scripts"]
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "SIM102", "SIM103", "SIM105", "SIM108", "SIM110"]

[tool.ruff.lint.per-file-ignores]
"packages/maxitor/tools/graph-builder/maxitor/graph_builder/**" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["aoa"]
known-third-party = ["fastapi", "langgraph", "maxitor", "mcp"]

[tool.vulture]
paths = [
    "packages/maxitor/maxitor-web/maxitor",
    "packages/maxitor/tools/repo-graph-port/maxitor",
    "packages/maxitor/tools/graph-builder/maxitor",
    "packages/maxitor/core/graph_compare/maxitor",
    "packages/maxitor/core/graph_map/maxitor",
    "packages/maxitor-plugin-template/src/maxitor_notes",
]
min_confidence = 80
exclude = ["tests/"]

[tool.taskipy.tasks]
maxitor = "uv run uvicorn maxitor.web.api.app:app --reload --host 127.0.0.1 --port 8000"
lint = "ruff check packages/ tests/ scripts/"
typecheck = "mypy packages/maxitor/maxitor-core/maxitor packages/maxitor/maxitor-web/maxitor packages/maxitor/tools/repo-graph-port/maxitor packages/maxitor/tools/plugin-installer/maxitor packages/maxitor/tools/graph-builder/maxitor packages/maxitor/core/graph_compare/maxitor packages/maxitor/core/graph_map/maxitor packages/maxitor-plugin-sdk/src/maxitor_plugin_sdk packages/maxitor-plugin-template/src/maxitor_notes"
pylint = "pylint packages/maxitor packages/maxitor-plugin-sdk/src/maxitor_plugin_sdk packages/maxitor-plugin-template/src/maxitor_notes"
dead = "vulture"
cc = "python scripts/check_radon.py cc"
mi = "python scripts/check_radon.py mi"
