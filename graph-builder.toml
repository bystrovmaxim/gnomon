# graph-builder.toml — the graphs of this repository, each saved in a file that changes with every merge.
# `graph-builder write` builds them and updates the files; `graph-builder check` fails when a file is stale.
graph_builder = "1.0"

[[graph]]
name = "maxitor"
build = "uv run --extra dev python -m maxitor.web.build_graph"
file = "packages/maxitor/maxitor-web/graph.json"

[[graph]]
name = "repo-graph-port"
build = "uv run --extra dev python -m maxitor.repo_graph_port.build_graph"
file = "packages/maxitor/tools/repo-graph-port/graph.json"

[[graph]]
name = "maxitor-plugin-template"
build = "uv run --extra dev python -m maxitor_notes.build_graph"
file = "packages/maxitor-plugin-template/graph.json"

[[graph]]
name = "plugin-installer"
build = "uv run --extra dev python -m maxitor.plugin_installer.build_graph"
file = "packages/maxitor/tools/plugin-installer/graph.json"

[[graph]]
name = "plugin-runner"
build = "uv run --extra dev python -m maxitor.plugin_runner.build_graph"
file = "packages/maxitor/tools/plugin-runner/graph.json"
