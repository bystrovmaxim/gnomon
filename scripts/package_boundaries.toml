# Package import boundaries of Maxitor's production code.
# Keys action_machine | maxitor | repo_graph_port are canonical internal names; action_machine is AOA, read from
# the submodule external/aoa, so that an import of it is named by its owner like any other.
# may_import lists which other internal packages a package may import (not including itself).

[packages.action_machine]
current_roots = ["external/aoa/packages/aoa-action-machine/src/aoa/action_machine"]
future_roots = ["external/aoa/packages/aoa-action-machine/src/aoa/action_machine"]
import_prefixes = ["action_machine", "aoa.action_machine"]
may_import = []

[packages.maxitor]
current_roots = ["packages/maxitor/maxitor-web/maxitor/web"]
future_roots = ["packages/maxitor/maxitor-web/maxitor/web"]
import_prefixes = ["maxitor.web"]
# plugins: ``maxitor plugin build`` runs the core's own step of building a plugin's frontend, so an author gets the
# build the installer makes; nothing else of the web part touches the domain plugins.
may_import = ["action_machine", "graph_builder", "graph_compare", "graph_map", "plugins"]

# Maxitor's core: accounts, organizations and the session. It imports neither the graph viewer nor a tool; it reaches
# the domain plugins only to serve its routes and the organization's tree.
[packages.core]
current_roots = ["packages/maxitor/maxitor-core/maxitor/core"]
future_roots = ["packages/maxitor/maxitor-core/maxitor/core"]
import_prefixes = ["maxitor.core"]
may_import = ["action_machine", "plugins"]

# The core's domain plugins: the marketplace and the plugins of each organization. It builds on the core's storage,
# roles and refusals, and never on the graph viewer or a tool.
[packages.plugins]
current_roots = ["packages/maxitor/maxitor-core/maxitor/core/plugins"]
future_roots = ["packages/maxitor/maxitor-core/maxitor/core/plugins"]
import_prefixes = ["maxitor.core.plugins"]
may_import = ["action_machine", "core"]

# The installer: a process of its own that checks and deploys plugin versions by running the domain plugins' actions.
[packages.plugin_installer]
current_roots = ["packages/maxitor/tools/plugin-installer/maxitor/plugin_installer"]
future_roots = ["packages/maxitor/tools/plugin-installer/maxitor/plugin_installer"]
import_prefixes = ["maxitor.plugin_installer"]
may_import = ["action_machine", "core", "plugins"]

# The runner: a process of its own that starts, watches and stops plugin processes by running the domain plugins' actions.
[packages.plugin_runner]
current_roots = ["packages/maxitor/tools/plugin-runner/maxitor/plugin_runner"]
future_roots = ["packages/maxitor/tools/plugin-runner/maxitor/plugin_runner"]
import_prefixes = ["maxitor.plugin_runner"]
may_import = ["action_machine", "core", "plugins"]

# The repo-graph-port service: it never imports the front, and the front reads it over HTTP, never imports it.
[packages.repo_graph_port]
current_roots = ["packages/maxitor/tools/repo-graph-port/maxitor/repo_graph_port"]
future_roots = ["packages/maxitor/tools/repo-graph-port/maxitor/repo_graph_port"]
import_prefixes = ["maxitor.repo_graph_port"]
may_import = ["action_machine", "graph_builder", "graph_compare"]

# Production-only import exceptions (rare). Each row must include path, imports, reason, expires.
allow = []

# Standalone packages live outside the ``aoa`` namespace and may import nothing from ``aoa``.
# ``maxitor.graph_builder`` is Maxitor's graph-file command, installed by ``pip install maxitor`` with no extra:
# it imports nothing from ``aoa`` and nothing of the front, whose dependencies come only with ``[front]``.
[standalone.graph_builder]
roots = ["packages/maxitor/tools/graph-builder/maxitor/graph_builder"]
import_prefixes = ["maxitor.graph_builder"]
forbid = ["maxitor.web", "maxitor.repo_graph_port"]

# ``maxitor.graph_compare`` compares two graph documents for the front and the tools alike: it needs the standard
# library alone (its own test checks that) and imports nothing of ``aoa``, the front or a tool.
[standalone.graph_compare]
roots = ["packages/maxitor/core/graph_compare/maxitor/graph_compare"]
import_prefixes = ["maxitor.graph_compare"]
forbid = ["maxitor.web", "maxitor.repo_graph_port", "maxitor.graph_builder"]

# ``maxitor.graph_map`` turns a graph document into the map the front reads: the standard library alone, like the comparison.
[standalone.graph_map]
roots = ["packages/maxitor/core/graph_map/maxitor/graph_map"]
import_prefixes = ["maxitor.graph_map"]
forbid = ["maxitor.web", "maxitor.repo_graph_port", "maxitor.graph_builder"]
