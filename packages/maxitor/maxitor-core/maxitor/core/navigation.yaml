# navigation.yaml — the core's nodes in Maxitor's left tree (the plugin concept, 7.1).
# Every node with an id is an attachment node: a plugin may stand under it. Their full names (core:settings,
# core:settings.plugins) are the core's contract with plugins: renaming or removing one is a major version of the core.
navigation: 1
nodes:
  # The organization's settings, at the foot of the tree, for its administrators.
  - id: settings
    attach: root
    title: Settings
    icon: settings
    order: 10000
    roles: [administrator]
    children:
      - id: settings.plugins
        title: Plugins
        icon: puzzle
        order: 100
        page: /settings/plugins
        roles: [administrator]
