# packages/maxitor/pyproject.toml — publishable distribution ``maxitor``: one package from web/, tools/ and skills/, parts chosen by extras.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxitor"
version = "4.9.0"
description = "Maxitor: its web part and its tools, one package with extras."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "@Bystrov.Maxim" }]
# Every part's code is in the wheel; an extra brings one part's dependencies. The base install is
# the ``graph-builder`` command: jsonschema-rs decides whether a document is a graph (the demo's in 0.06 s,
# not 24 s); jsonschema explains a refusal on the one element jsonschema-rs stopped at.
dependencies = [
    "jsonschema>=4.17,<5",
    "jsonschema-rs>=0.60,<1",
]

[project.optional-dependencies]
# The repo-graph-port service: reads a graph's history from its repository and serves it.
repo-graph-port = [
    "aoa-action-machine>=1.0.1a0",
    "aoa-fastapi-adapter>=1.3.0",
    "uvicorn>=0.30",
    "PyJWT[crypto]>=2.8,<3",
    "httpx>=0.28,<1.0",
]
# The web part: Maxitor's server and its built web client.
web = [
    "aoa-action-machine>=1.0.1a0",
    "aoa-fastapi-adapter>=1.3.0",
    "duckdb>=1.5,<2",
    "httpx>=0.28,<1.0",
    "uvicorn>=0.30",
    "websockets>=15",
]
# Maxitor's core: accounts and their ways in, organizations, the session — on PostgreSQL.
core = [
    "aoa-action-machine[postgres,jwt]>=1.0.1a0",
    "aoa-fastapi-adapter>=1.3.0",
    "argon2-cffi>=23.1,<26",
    "botocore>=1.34,<2",
    "geoip2>=4.8,<6",
    "httpx>=0.28,<1.0",
    "maxitor-plugin-sdk>=1.5,<2",
    "packageurl-python>=0.16,<1",
    "packaging>=24",
    "PyYAML>=6.0,<7",
    "uvicorn>=0.30",
]
# The plugin installer: checks and deploys plugin versions as the database role maxitor_installer.
plugin-installer = [
    "maxitor[core]",
    "scramp>=1.4,<2",
]
# The plugin runner: starts, watches and stops the processes of every plugin version enabled somewhere.
plugin-runner = [
    "maxitor[core]",
]
# maxitor plugin check and maxitor plugin build: the SDK holds the schemas of a plugin's files and the
# compatibility decision; the build runs the core's own step, a controller of the action machine. It joins
# ``all`` once maxitor-plugin-sdk is published, so that installing ``all`` never asks for what an index lacks.
plugins = [
    "aoa-action-machine>=1.0.1a0",
    "maxitor-plugin-sdk>=1.0,<2",
    "PyYAML>=6.0,<7",
]
all = ["maxitor[web]", "maxitor[repo-graph-port]", "maxitor[core]", "maxitor[plugin-installer]", "maxitor[plugin-runner]"]

# AOA is external code: the submodule external/aoa, fixed to one commit (update-aoa.sh moves it).
[tool.uv.sources]
aoa-action-machine = { path = "../../external/aoa/packages/aoa-action-machine", editable = true }
aoa-fastapi-adapter = { path = "../../external/aoa/packages/aoa-fastapi-adapter", editable = true }
maxitor-plugin-sdk = { workspace = true }

[project.urls]
Homepage = "https://github.com/bystrovmaxim/gnomon"
Repository = "https://github.com/bystrovmaxim/gnomon"
Issues = "https://github.com/bystrovmaxim/gnomon/issues"

[project.scripts]
graph-builder = "maxitor.graph_builder.cli:main"
maxitor = "maxitor.web.launch:main"
maxitor-core = "maxitor.core.launch:main"
maxitor-plugin-installer = "maxitor.plugin_installer.launch:main"
maxitor-plugin-runner = "maxitor.plugin_runner.launch:main"
repo-graph-port = "maxitor.repo_graph_port.launch:main"

# One package from several folders: the web part (maxitor-web/), the tools and services (tools/<name>/), the
# code they share (core/<name>/) and the skills (skills/). ``maxitor`` is a namespace package; each part keeps its code in ``<part>/maxitor/<name>/``.
[tool.hatch.build.targets.wheel]
only-include = ["maxitor-core/maxitor", "maxitor-web/maxitor", "tools/repo-graph-port/maxitor", "tools/plugin-installer/maxitor", "tools/plugin-runner/maxitor", "tools/graph-builder/maxitor", "core/graph_compare/maxitor", "core/graph_map/maxitor"]
artifacts = ["maxitor-web/maxitor/web/static/**/*"]
dev-mode-dirs = ["maxitor-core", "maxitor-web", "tools/repo-graph-port", "tools/plugin-installer", "tools/plugin-runner", "tools/graph-builder", "core/graph_compare", "core/graph_map"]

[tool.hatch.build.targets.wheel.sources]
"maxitor-core" = ""
"maxitor-web" = ""
"tools/repo-graph-port" = ""
"tools/plugin-installer" = ""
"tools/plugin-runner" = ""
"tools/graph-builder" = ""
"core/graph_compare" = ""
"core/graph_map" = ""

[tool.hatch.build.targets.wheel.force-include]
"skills" = "maxitor/skills"

# The core's @maxitor/* packages, which every plugin's frontend is built with (hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.hatch.build.targets.sdist]
exclude = [
  "maxitor-web/client/node_modules",
  "maxitor-web/client/node_modules/**",
  "maxitor-web/client/.vite",
  "maxitor-web/client/.vite/**",
  # A service's saved graph is the repository's history, not the package's (graph-builder.toml).
  "maxitor-web/graph.json",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
