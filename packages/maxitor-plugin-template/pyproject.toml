# packages/maxitor-plugin-template/pyproject.toml — the plugin template: the Maxitor plugin `notes`, as a pip package.
# A real plugin is a package like this one: its passport, navigation, foreign keys and migrations travel inside the
# Python package, and its built Next.js frontend travels as package data under maxitor_notes/_web.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxitor-plugin-template"
version = "0.5.0"
description = "The Maxitor plugin template: a small complete plugin, notes on catalog items."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "@Bystrov.Maxim" }]
# The template is copied, not installed from an index.
classifiers = ["Private :: Do Not Upload"]
# The plugin's own Python libraries. Other Maxitor plugins are never listed here: they are dependencies of the
# passport, and Maxitor's installer resolves them.
dependencies = [
    "aoa-action-machine[postgres,jwt]>=1.6.0b2",
    "aoa-fastapi-adapter>=1.5.0",
    "maxitor-plugin-sdk>=1.0,<2",
    "PyYAML>=6.0,<7",
    "uvicorn>=0.30",
]

# Maxitor's installer finds the passport through this entry point, reading the wheel without installing it.
[project.entry-points."maxitor.plugins"]
notes = "maxitor_notes"

# Inside the gnomon repository AOA comes from the submodule external/aoa and the SDK from the workspace; a copy of
# the template drops this table and takes both from PyPI.
[tool.uv.sources]
aoa-action-machine = { path = "../../external/aoa/packages/aoa-action-machine", editable = true }
aoa-fastapi-adapter = { path = "../../external/aoa/packages/aoa-fastapi-adapter", editable = true }
maxitor-plugin-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/maxitor_notes"]
