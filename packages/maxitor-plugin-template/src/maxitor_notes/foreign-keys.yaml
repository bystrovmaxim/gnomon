# foreign-keys.yaml — foreign keys from the plugin's tables to tables of Maxitor or of a direct dependency.
# Identifiers only: no constraint name, no delete rule (always RESTRICT), no SQL. The source schema is always the
# plugin's own. Maxitor's installer checks every name and creates the keys itself.
foreign_keys:
  # A note's writer is a member of the note's organization: the core's user of that account there.
  - from: { table: note, columns: [organization_id, writer_id] }
    to:   { schema: core, table: user, columns: [organization_id, account_id] }
