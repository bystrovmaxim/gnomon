# navigation.yaml — the plugin's nodes in Maxitor's left tree.
# The plugin only adds nodes: it attaches them to the root, to a node of Maxitor or to a node of a direct dependency.
# Maxitor's installer builds the whole tree and refuses the installation if an attachment does not hold.
navigation: 1
nodes:
  # A section of its own in the root of the tree: the plugin needs nothing but the core, so it hangs its nodes here.
  - id: notes
    attach: root
    title: Notes
    icon: note
    order: 500
    page: /
    roles: [member]
    children:
      # A list node: one instance per item of the organization, read from the plugin's action list_items at the
      # panel's moment. Each instance shows the item's title and puts its key into the scope as item_id, for every
      # node beneath it. It opens no page of its own: its three pages stand under it.
      - id: item
        each:
          source: list_items
          key: item_id
        roles: [member]
        children:
          - id: item-notes
            title: Notes
            icon: note
            order: 100
            # The page's path inside the plugin; Maxitor opens it in the right panel at
            # /w/<organization>/notes/items/<item_id>.
            page: /items/{item_id}
            roles: [member]
            # The page's controls. Maxitor draws them over the right panel, in the same places for every plugin; each
            # is an address parameter, which the page reads like any other.
            controls:
              views:
                param: view
                default: list
                options:
                  - { value: list, label: List }
                  - { value: table, label: Table }
              filters:
                - title: Author
                  param: author
                  # The options come from data: a reading action of the plugin, read at the panel's moment.
                  source: list_note_authors
            room:
              # Address parameters the whole room shares on this page: one participant switches the view, all see it.
              shared: [view]
              # Pointers travel as an anchor and a fraction inside it; the page marks its notes with data-room-anchor.
              surface: document
            # How the page answers the core's time scale. read is its reading action: over a stretch it counts the
            # page's own bars. milestones and card are actions of the folder history/ (history/<name>_action.py). The
            # comparisons are the passport's, as no compare narrows them here.
            history:
              read: list_item_notes
              milestones: list_note_history
              card: note_milestone_card

          # The item's notes as the revision in force holds them: milestones alone on the scale, a point per revision.
          - id: item-published
            title: Published notes
            icon: note
            order: 110
            page: /items/{item_id}/published
            roles: [member]
            history:
              milestones: list_note_history
              card: note_milestone_card

          # What changed since the last revision. The draft is a comparison already: it offers one moment only.
          - id: item-draft
            title: Draft
            icon: note
            order: 120
            page: /items/{item_id}/draft
            roles: [member]
            history:
              compare: []
