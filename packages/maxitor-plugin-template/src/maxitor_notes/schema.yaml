# schema.yaml — the plugin's tables. No SQL: Maxitor's installer builds each table with its version table, the service
# fields (id, organization_id, created_at, updated_at), the overlap constraint and the indexes, by the rules of
# versioned storage. The keys to the core are in foreign-keys.yaml.
schema: 1
tables:
  note:
    description: A note on a catalog item. Read only by changing actions; screens read note_versions.
    columns:
      item_id: {type: uuid, nullable: false, description: The catalog item the note is about.}
      writer_id: {type: uuid, nullable: false, description: The account of the member who wrote the note.}
      body: {type: text, nullable: false, description: The text of the note.}
    indexes:
      - [item_id]
  revision:
    description: 'An item''s notes published under a number. Written once and never changed; its moment is when it was published, and it holds the notes as they read at that moment.'
    columns:
      item_id: {type: uuid, nullable: false, description: The catalog item whose notes are published.}
      number: {type: integer, nullable: false, description: 'The revision''s number for its item: 1, 2, … with no gap.'}
      title: {type: text, nullable: false, description: The revision's first line.}
      comment: {type: text, nullable: false, description: 'The revision''s own words: shown under the time scale when the revision is chosen.'}
      release: {type: text, nullable: true, description: 'A release label the revision was published as; empty when it carries none.'}
      publisher_id: {type: uuid, nullable: false, description: The account of the member who published the revision.}
    unique:
      - [item_id, number]
    indexes:
      - [item_id]
