# maxitor-plugin.yaml — the passport of the plugin: who it is and what it needs.
# Maxitor's installer reads it from the wheel before installing anything.
passport: 3

# The global identifier: reverse domain notation, never changes.
id: io.github.bystrovmaxim.notes
# The name in one Maxitor installation: each version's schema notes_<version>, its user plg_notes_<version>, the path /p/notes.
name: notes
title: Notes
description: >
  Notes on the plugin's own items: who wrote what, and how it read at any past moment.
# Strictly x.y.z, equal to the version in pyproject.toml.
version: 0.11.0
# The major version of maxitor-plugin-sdk the plugin is built with; Maxitor must be built with the same.
sdk: 1

requires:
  # 4.7 is the first core that reads navigation format 3, where a page gives its history (4.5 builds frontends).
  maxitor: ">=4.7,<5"
  node: ">=22"

# Plugins this one cannot work without. The template needs only Maxitor itself.
# An entry names the plugin by id, a version range, and where to get it — a pip package or a wheel with its sha256:
#   - id: io.github.acme.tags
#     version: ">=2.1,<3"
#     source:
#       pip: acme-maxitor-tags
#   - id: io.github.acme.people
#     version: ">=1.4,<2"
#     source:
#       wheel: https://github.com/acme/maxitor-people/releases/download/v1.4.0/acme_maxitor_people-1.4.0-py3-none-any.whl
#       sha256: <64 hex digits>
dependencies: []

# A plugin has no roles of its own: its actions check the core's roles the gateway's token carries — member for
# every active user of the organization, administrator for its administrators, service for the plugin itself.

# Every page reads any past moment; that needs no declaration. The comparisons its pages can draw are declared here;
# a page may narrow them in navigation.yaml, never widen them.
history:
  compare: [diff, side_by_side]

backend:
  app: maxitor_notes.app:create_app

frontend:
  # The frontend's sources in the wheel: package.json, package-lock.json and the pages. Maxitor builds them with its
  # own @maxitor/panel; the wheel carries no built site.
  source: maxitor_notes/web
  navigation: maxitor_notes/navigation.yaml

# The plugin carries no SQL and no migrations: it declares its tables, and Maxitor builds them.
database:
  schema: maxitor_notes/schema.yaml
  foreign_keys: maxitor_notes/foreign-keys.yaml
