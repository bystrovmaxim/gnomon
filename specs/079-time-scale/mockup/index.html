<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxitor core — the panels follow one element · mockup</title>
<style>
  /* The visual language of the mockups of spec 059 and of issues #73 and #82: the same colours, header, tree and dialogs. */
  :root {
    --page-bg: #e9edf1; --ink: #0f172a; --ink2: #1e293b; --muted: #64748b; --faint: #94a3b8;
    --line: rgba(15,23,42,.1); --line2: rgba(15,23,42,.06);
    --sidebar: #EBF2F5; --canvas: #f6f8fa;
    --ok: #16a34a; --bad: #b91c1c; --warn: #b45309;
    --add: #16a34a; --rem: #dc2626; --chg: #d97706;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: var(--page-bg); display: flex; }
  button, textarea, input { font: inherit; color: inherit; }
  code, .mono { font-family: var(--mono); }

  /* ---------- mockup navigator ---------- */
  .nav { width: 300px; flex-shrink: 0; height: 100vh; overflow-y: auto; background: #fff; border-right: 1px solid var(--line); padding: 18px 12px 32px; }
  .nav h1 { font-size: 15px; margin: 0 6px 4px; }
  .nav .sub { font-size: 12px; color: var(--muted); margin: 0 6px 12px; line-height: 1.45; }
  .nav .group { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 14px 6px 4px; }
  .nav button.screen { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 7px; font-size: 13px; cursor: pointer; }
  .nav button.screen:hover { background: rgba(15,23,42,.05); }
  .nav button.screen.on { background: rgba(15,23,42,.08); font-weight: 600; }
  .nav button.screen .n { color: var(--muted); font-size: 11px; min-width: 24px; font-variant-numeric: tabular-nums; }
  .seg { display: flex; margin: 4px 6px 6px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: #f8fafc; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 6px; font-size: 12.5px; padding: 5px 0; cursor: pointer; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(15,23,42,.12); }
  .path { margin: 6px 4px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .path .pt { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .path .pf { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .path .steps { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .path .steps button { border: 1px solid var(--line); background: #f8fafc; border-radius: 6px; font-size: 11px; padding: 2px 6px; cursor: pointer; }
  .path .steps span { color: var(--faint); font-size: 11px; }

  .stage { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; padding: 18px 24px 48px; }
  .frame-cap { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .frame-cap b { color: var(--ink); }
  .frame-box { position: relative; }
  .frame-scale { transform-origin: top left; position: absolute; top: 0; left: 0; }
  .notes { max-width: 980px; margin-top: 18px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 20px 16px; }
  .notes h2 { font-size: 15px; margin: 0 0 6px; }
  .notes li { font-size: 13px; line-height: 1.55; }
  .notes ul { padding-left: 18px; margin: 6px 0 0; }
  .notes code { font-size: 12px; background: #f1f5f9; padding: 1px 4px; border-radius: 4px; }

  /* ---------- device ---------- */
  .device { width: 1360px; height: 840px; background: #fff; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 1px 2px rgba(15,23,42,.08), 0 8px 28px rgba(15,23,42,.12); }
  .urlbar { height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #f1f5f9; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .urlbar .u { flex: 1; max-width: 760px; height: 22px; border-radius: 6px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; padding: 0 10px; color: #334155; white-space: nowrap; overflow: hidden; }
  .urlbar .u b { color: var(--ink); font-weight: 600; }
  .urlbar .u i { font-style: normal; color: #1d4ed8; }

  .hdr { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; background: #fff; border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
  .burger { display: none; width: 32px; height: 32px; border: 0; background: none; border-radius: 7px; align-items: center; justify-content: center; cursor: pointer; margin-left: -6px; }
  .burger:hover { background: rgba(15,23,42,.06); }
  .logo { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13.5px; margin-right: 8px; }
  .logo .mk { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .crumb { display: inline-flex; align-items: baseline; gap: 6px; height: 28px; line-height: 28px; padding: 0 8px; font-size: 13px; font-weight: 600; white-space: nowrap; min-width: 0; }
  .crumb .lv { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .crumb .sep { color: var(--faint); font-weight: 400; margin: 0 2px; }
  .hdr .spacer { flex: 1; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #cbd5e1; color: #1e293b; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .avatar.sm { width: 24px; height: 24px; font-size: 10px; }
  .ico { width: 16px; height: 16px; flex-shrink: 0; }
  .ico.sm { width: 14px; height: 14px; }

  /* The core's moment in the top row: the graph viewer's pill (VersionButton) — clock, the moment in bold, chevron. */
  .pill { height: 28px; display: inline-flex; align-items: center; border-radius: 8px; background: rgba(15,23,42,.05); margin-left: 6px; min-width: 0; }
  .pill.open { background: rgba(15,23,42,.1); }
  .pill .pb2 { height: 28px; border: 0; background: none; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; font-size: 12.5px; color: #334155; cursor: pointer; white-space: nowrap; min-width: 0; border-radius: 8px; }
  .pill .pb2 b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .pill .pb2 .live { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(22,163,74,.15); }
  .pill .pb2 .past { width: 7px; height: 7px; border-radius: 50%; background: #2563eb; flex-shrink: 0; }
  .pill .stp { width: 26px; height: 28px; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #475569; }
  .pill .stp.off { color: #cbd5e1; cursor: default; }
  .pill .dv { width: 1px; height: 16px; background: rgba(15,23,42,.12); }
  .pill .nowb { border: 0; background: none; font-size: 12px; color: #1d4ed8; font-weight: 600; padding: 0 9px; height: 28px; cursor: pointer; white-space: nowrap; }

  /* ---------- the organization's frame ---------- */
  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .sb { width: 255px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid rgba(15,23,42,.08); display: flex; flex-direction: column; }
  .sbh { flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 4px 8px 2px; }
  .sbb { width: 32px; height: 32px; border: 0; padding: 0; border-radius: 6px; background: transparent; color: rgb(100,116,139); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .sbb:hover { background: rgba(15,23,42,.07); }
  .sbb.off { opacity: .4; cursor: default; } .sbb.off:hover { background: transparent; }
  .sb.collapsed { width: 48px; }
  .sb.collapsed .sbh { flex-direction: column; padding: 4px 8px; }
  .tree { flex: 1; overflow-y: auto; padding: 6px 8px 4px; }
  .tg, .ti { display: flex; align-items: center; min-width: 0; border-radius: 6px; cursor: pointer; color: rgb(30,41,59); font-size: 13px; line-height: 1.35; }
  .tg { min-height: 36px; padding: 0 8px; font-weight: 600; letter-spacing: -.01em; margin-top: 4px; }
  .ti { min-height: 32px; padding: 0 8px 0 32px; font-weight: 400; }
  .ti.l2 { padding-left: 56px; }
  .tg:hover, .ti:hover { background: rgba(15,23,42,.07); }
  .ti.on, .ti.on:hover { background: rgba(15,23,42,.09); }
  .tg .slot, .ti .slot { width: 32px; flex-shrink: 0; display: inline-flex; align-items: center; color: rgb(100,116,139); }
  .tg .slot .ico { width: 20px; height: 20px; }
  .ti .slot .ico { width: 16px; height: 16px; opacity: .88; }
  .tg .lb, .ti .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

  /* Maxitor's controls over the right panel, declared in navigation.yaml: the same place for every plugin. */
  .ctl { height: 42px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line2); background: #fff; }
  .ctl .vseg { display: flex; border: 1px solid var(--line); border-radius: 7px; padding: 2px; background: #f8fafc; }
  .ctl .vseg span { font-size: 12px; padding: 3px 10px; border-radius: 5px; color: var(--muted); cursor: pointer; }
  .ctl .vseg span.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(15,23,42,.12); }
  .ctl .flt { height: 28px; border: 1px solid var(--line); border-radius: 7px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; font-size: 12px; color: #334155; background: #fff; cursor: pointer; }
  .ctl .who { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .ctl .who .avatar { width: 22px; height: 22px; font-size: 9px; border: 2px solid #fff; margin-left: -8px; }

  /* ---------- the plugin's page ---------- */
  .page { flex: 1; overflow-y: auto; background: var(--canvas); padding: 22px 32px 48px; }
  .page .inner { max-width: 760px; margin: 0 auto; }
  .ph { display: flex; align-items: flex-end; gap: 16px; }
  .ph .tx { flex: 1; min-width: 0; }
  .ph .k { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .ph h2 { font-size: 22px; margin: 2px 0 0; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 16px; }
  .tabs button { border: 0; background: none; padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .tabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .tabs .cnt { font-size: 11px; background: #fef3c7; color: #92400e; border-radius: 9px; padding: 0 6px; font-weight: 600; }
  .tabs .cnt.z { background: #e2e8f0; color: #475569; }

  .banner { display: flex; gap: 10px; align-items: center; border-radius: 9px; padding: 10px 12px; font-size: 13px; line-height: 1.45; margin-bottom: 14px; }
  .banner .ico { flex-shrink: 0; }
  .banner .tx { flex: 1; min-width: 0; }
  .banner.past { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; }
  .banner.rev { background: #f5f3ff; border: 1px solid #ddd6fe; color: #4c1d95; }
  .banner.draft { background: #fffbeb; border: 1px solid #fde68a; color: #78350f; }
  .banner .btn2 { flex-shrink: 0; }

  .composer { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .composer textarea { flex: 1; border: 0; outline: 0; resize: none; font-size: 13.5px; line-height: 1.5; min-height: 22px; padding: 3px 0; background: none; }
  .composer.focus { border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,.08); }

  .note { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; position: relative; }
  .note.fresh { border-color: #86efac; box-shadow: 0 0 0 3px rgba(22,163,74,.1); }
  .note.editing { border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,.08); }
  .note.conflict { border-color: #fca5a5; box-shadow: 0 0 0 3px rgba(239,68,68,.08); }
  .note.gone .nb { color: var(--muted); }
  .nh { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .nh b { font-weight: 600; }
  .nh .tm { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .nh .acts { margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
  .ib { width: 28px; height: 28px; border: 0; background: none; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: #64748b; cursor: pointer; }
  .ib:hover { background: rgba(15,23,42,.06); color: var(--ink); }
  .ib.del:hover { color: var(--bad); background: #fef2f2; }
  .ib.more { display: none; }
  .nb { font-size: 13.5px; line-height: 1.55; color: var(--ink2); margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .note { min-width: 0; overflow: hidden; }
  .tagnew { font-size: 10.5px; font-weight: 600; border-radius: 5px; padding: 1px 6px; background: #dcfce7; color: #166534; }
  .note textarea { width: 100%; border: 1px solid rgba(15,23,42,.2); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; line-height: 1.5; resize: vertical; min-height: 66px; margin-top: 8px; outline: 0; }
  .note textarea:focus { border-color: #0f172a; }
  .eft { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .eft .hint { font-size: 11.5px; color: var(--muted); margin-right: auto; }
  .eft .hint code { font-size: 11px; background: #f1f5f9; padding: 0 4px; border-radius: 4px; }

  .since { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 9px; display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: #475569; line-height: 1.5; }
  .since .mk { font-size: 10.5px; font-weight: 600; border-radius: 5px; padding: 1px 7px; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
  .since .mk.chg { background: #fef3c7; color: #92400e; }
  .since .mk.del { background: #fee2e2; color: #991b1b; }
  .since .mk.same { background: #dcfce7; color: #166534; }
  .since .tx { flex: 1; min-width: 0; }
  .since .now { color: var(--muted); }
  .since .btn2 { flex-shrink: 0; }

  .cbox { margin-top: 10px; border-radius: 8px; background: #fef2f2; border: 1px solid #fecaca; padding: 10px 12px; font-size: 12.5px; color: #7f1d1d; line-height: 1.5; }
  .cbox .t { font-weight: 600; display: flex; gap: 7px; align-items: center; }
  .cbox .mine { background: #fff; border: 1px solid #fecaca; border-radius: 7px; padding: 8px 10px; margin-top: 8px; color: var(--ink2); font-size: 13px; }
  .cbox .mine .lbl { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
  .cbox .ft { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .del-w { background: #fee2e2; color: #991b1b; text-decoration: line-through; border-radius: 3px; padding: 0 1px; }
  .ins-w { background: #dcfce7; color: #166534; border-radius: 3px; padding: 0 1px; }

  .revhd { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; }
  .revhd .ref { font-size: 15px; font-weight: 700; background: #ede9fe; color: #5b21b6; border-radius: 7px; padding: 4px 9px; font-variant-numeric: tabular-nums; }
  .revhd .tt { flex: 1; min-width: 0; }
  .revhd .tt b { font-size: 14px; }
  .revhd .tt div { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .sum { display: inline-flex; gap: 8px; font-size: 12px; font-weight: 600; flex-wrap: wrap; }
  .sum .a { color: var(--add); } .sum .r { color: var(--rem); } .sum .c { color: var(--chg); } .sum .z { color: var(--muted); font-weight: 400; }

  .chrow { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 10px; }
  .chrow .st { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .chrow .st.a { background: #dcfce7; color: #166534; } .chrow .st.r { background: #fee2e2; color: #991b1b; } .chrow .st.c { background: #fef3c7; color: #92400e; }
  .chrow .bd { flex: 1; min-width: 0; }
  .chrow .bd .w { font-size: 12px; color: var(--muted); }
  .chrow .bd .nb { margin-top: 3px; }

  .empty-st { background: #fff; border: 1.5px dashed rgba(15,23,42,.16); border-radius: 12px; padding: 34px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.55; }
  .empty-st b { color: var(--ink2); font-size: 15px; display: block; margin-bottom: 4px; }
  .empty-st .btn2 { margin-top: 14px; }

  .nf { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--canvas); padding: 20px; }
  .nf .box { text-align: center; max-width: 420px; }
  .nf .big { width: 54px; height: 54px; border-radius: 50%; background: #e2e8f0; color: #64748b; display: inline-flex; align-items: center; justify-content: center; }
  .nf .big .ico { width: 26px; height: 26px; }
  .nf h2 { font-size: 19px; margin: 12px 0 6px; }
  .nf p { font-size: 13px; color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
  .nf code { font-size: 12px; background: #f1f5f9; padding: 1px 5px; border-radius: 4px; color: #334155; }

  /* ---------- buttons ---------- */
  .btn2 { height: 30px; border-radius: 7px; border: 1px solid rgba(15,23,42,.18); background: #fff; font-size: 12.5px; padding: 0 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; justify-content: center; }
  .btn2:hover { border-color: rgba(15,23,42,.4); }
  .btn2.pri { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .btn2.dis { opacity: .45; cursor: not-allowed; }
  .btn2.dpri { background: var(--bad); color: #fff; border-color: var(--bad); font-weight: 600; }
  .btn2.blue { color: #1d4ed8; border-color: #bfdbfe; background: #fff; }
  .btn2.blue:hover { border-color: #60a5fa; }
  .lnk { color: #1d4ed8; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }


  /* ---------- the core's moment, on the right of the top row ---------- */
  .hdr .pill { margin: 0 8px 0 0; }
  .pill .md { font-weight: 400; color: #475569; }
  .pill .cnts { display: inline-flex; gap: 5px; font-weight: 600; margin-left: 4px; flex-shrink: 0; }
  .pill .ab { font-weight: 600; color: #475569; }

  /* ---------- the picker card: the graph viewer's VersionPicker, 760 × auto, opened under the pill ---------- */
  .card { position: absolute; z-index: 50; top: 89px; right: 10px; width: 760px; max-height: calc(100% - 100px); overflow-y: auto; background: #fff;
          border: 1px solid rgba(15,23,42,.1); border-radius: 10px; box-shadow: 0 12px 40px rgba(15,23,42,.16), 0 1px 2px rgba(15,23,42,.06); padding: 14px 20px 12px; }
  .device:not(.phone) .card { overflow: visible; max-height: none; }
  .card .grab { display: none; }
  .chd { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .chd .tt { min-width: 0; }
  .chd .tt b { font-size: 13px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chd .tt span { font-size: 11.5px; color: var(--muted); line-height: 16px; }
  .chd .rt { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .ib2 { width: 28px; height: 28px; border: 0; background: none; border-radius: 8px; color: #64748b; display: inline-flex; align-items: center; justify-content: center; cursor: help; }
  .ib2.sm { cursor: pointer; }
  .ib2.sm.on { color: #8250df; }
  .ib2:hover { background: rgba(15,23,42,.06); color: var(--ink); }
  .modes { display: inline-flex; border: 1px solid rgba(15,23,42,.12); border-radius: 8px; padding: 2px; gap: 2px; }
  .modes button { height: 24px; border: 0; background: none; border-radius: 6px; padding: 0 8px; font-size: 12px; color: #475569; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
  .modes button:hover { background: rgba(15,23,42,.05); }
  .modes button.on { background: rgba(15,23,42,.08); color: var(--ink); font-weight: 600; }
  .modes .ph-lab { display: none; }

  /* the continuous history: a histogram of changes, zoomed and moved like Kibana's */

  /* The date pickers: Apple's layout — round days, a band for a range, a chevron on the month, wheels for a jump — in Maxitor's own colours and sizes. */

function base(o) { return Object.assign(JSON.parse(JSON.stringify(DEF)), JSON.parse(JSON.stringify(o))); }
let CUR = null;
function openNum(n) {
  for (const [, items] of SCREENS) for (const [k, , st] of items) if (k === n) {
    const ph = S.phone, an = S.anchors;
    for (const key of Object.keys(S)) delete S[key];
    Object.assign(S, base(st), { phone: st.phone === undefined ? ph : st.phone, anchors: an });
    if (S.phone && (S.view === "canvas" || S.view === "table") && S.hover) S.side = S.hover.side === "b" ? "a" : "b";
    if (S.phone && S.sel) S.side = S.sel.side === "b" ? "a" : "b";
    CUR = n;
    const bring = S._bring, rows = S._row; delete S._bring; delete S._row;
    render();
    if (rows) { for (const [sd, i] of Object.entries(rows)) { S.cam[sd] = null; const c = camOf(sd), cv = document.querySelector(`.cv[data-side="${sd}"]`); S.cam[sd] = { ...c, y: cv.offsetHeight / 2 - (HEADH + i * RH + RH / 2) * c.k }; } applyCams(); applyMarks(); }
    if (bring) { const t = S.sel; S.sel = null; select(t.side, t.chain); }
    return;
  }
}
function renderNav() {
  let h = `<h1>Maxitor core: the panels follow one element</h1><div class="sub">The parts of issue #98 the notes cannot show: anchors nested in anchors and a list of 10,000 rows, on the core's test page of #74, from fixtures. The scale, its legend and the milestones of other plugins are in the notes' mockup, specs/074-notes-history/mockup, 3.5–3.10.</div>`;
  h += `<div class="seg"><button class="${S.phone ? "" : "on"}" onclick="go({phone:false})">Desktop</button><button class="${S.phone ? "on" : ""}" onclick="go({phone:true})">Phone</button></div>`;
  h += `<label class="tgl"><input type="checkbox" ${S.anchors ? "checked" : ""} onchange="go({anchors:this.checked})">Show the anchors <small>— not on the real screen</small></label>`;
  for (const [g, items] of SCREENS) {
    h += `<div class="group">${g}</div>`;
    for (const [n, t] of items) h += `<button class="screen${CUR === n ? " on" : ""}" onclick="openNum('${n}')"><span class="n">${n}</span>${t}</button>`;
  }
  document.getElementById("nav").innerHTML = h;
}
function renderNotes() {
  const note = NOTES[CUR], dev = S.phone ? "phone, 375 × 812" : "desktop, 1360 × 840";
  document.getElementById("cap").innerHTML = note ? `<b>${CUR} · ${note[0]}</b> — ${dev}, the screen is live` : `Free navigation — ${dev}`;
  document.getElementById("notes").innerHTML = note ? `<h2>${CUR} · ${note[0]}</h2><ul>${note[1].map(x => `<li>${x}</li>`).join("")}</ul>` : "";
}
function fit() {
  const stage = document.getElementById("stage"), sc = document.getElementById("scale"), box = document.getElementById("box");
  const w = S.phone ? 375 : 1360, h = S.phone ? 812 : 840;
  const k = Math.min(1, (stage.clientWidth - (stage.style.padding === "0px" ? 0 : 48)) / w);
  sc.style.transform = `scale(${k})`; box.style.height = h * k + "px";
}
window.addEventListener("resize", fit);
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.cal) calCancel(); if (e.key === "Escape" && S.one) oneCancel(); });
/* A press outside a picker closes it as Cancel does; the control that opened it closes it too, by its own click. */
document.addEventListener("mousedown", e => {
  if (S.cal && !e.target.closest(".calpop, .fp [data-rr]")) calCancel();
  if (S.one && !e.target.closest(".calpop.one, .rvw")) oneCancel();
}, true);
(function fromHash() {
  const h = location.hash.slice(1), m = h.match(/(\d+\.\d+)/);
  S.phone = h.includes("phone");
  openNum(m ? m[1] : "1.1");
})();
</script>
