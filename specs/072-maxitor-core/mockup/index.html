.mx-burger { display: none; width: var(--mx-tree-slot); height: var(--mx-tree-slot); border: 0; background: none; border-radius: var(--mx-radius-sm); align-items: center; justify-content: center; cursor: pointer; }

/* menus of the top row */
.mx-menu { position: absolute; z-index: 50; top: var(--mx-top-row); right: var(--mx-space-4); width: var(--mx-menu-width); background: var(--mx-surface); border: var(--mx-line-width) solid var(--mx-line); border-radius: var(--mx-radius-md); box-shadow: var(--mx-shadow-pop); padding: var(--mx-space-3) 0; }
.mx-menu.left { left: var(--mx-space-5); right: auto; }
.mx-menu-who { padding: var(--mx-space-4) var(--mx-space-6) var(--mx-space-5); border-bottom: var(--mx-line-width) solid var(--mx-line-2); font-size: var(--mx-text-sm); color: var(--mx-muted); }
.mx-menu-who b { display: block; font-size: var(--mx-text-md); color: var(--mx-ink); }
.mx-menu-group { font-size: var(--mx-text-xs); font-weight: var(--mx-weight-bold); letter-spacing: var(--mx-tracking-caps); text-transform: uppercase; color: var(--mx-muted); padding: var(--mx-space-5) var(--mx-space-6) var(--mx-space-2); }
.mx-menu-item { display: flex; align-items: center; gap: var(--mx-space-4); width: 100%; padding: var(--mx-space-3) var(--mx-space-6); font-size: var(--mx-text-md); border: 0; background: none; text-align: left; color: inherit; text-decoration: none; cursor: pointer; }
.mx-menu-item:hover { background: var(--mx-hover); }
.mx-menu-item .mx-tick { margin-left: auto; color: var(--mx-ok); }
.mx-menu-item .mx-code { margin-left: auto; font-size: var(--mx-text-sm); color: var(--mx-faint); }
.mx-menu-mark { width: var(--mx-icon-lg); height: var(--mx-icon-lg); border-radius: var(--mx-radius-xs); font-size: var(--mx-text-tiny); font-weight: var(--mx-weight-heavy); color: var(--mx-on-ink); display: inline-flex; align-items: center; justify-content: center; text-transform: uppercase; }
.mx-menu hr { border: 0; border-top: var(--mx-line-width) solid var(--mx-line-2); margin: var(--mx-space-3) 0; }
.mx-veil { position: fixed; inset: 0; z-index: 15; }
/* A crumb of an entered level steps the panel out to it (spec 085, FR-012). */
.mx-path-link { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.mx-path-link:hover { text-decoration: underline; }

/* the tree */
.mx-tree { width: var(--mx-tree-width); flex-shrink: 0; background: var(--mx-sidebar); border-right: var(--mx-line-width) solid var(--mx-line); display: flex; flex-direction: column; }
.mx-tree.collapsed { width: auto; }
/* The head's buttons stand on the level's left edge: a button's icon starts where the level's icon and the first column do. */
.mx-tree-head { min-height: calc(var(--mx-tree-slot) + var(--mx-space-2) + var(--mx-space-1)); flex-shrink: 0; display: flex; align-items: center; gap: var(--mx-space-2); padding: var(--mx-space-2) var(--mx-space-4) var(--mx-space-1) 0; }
/* The tree's pictograms, as the graph viewer's sidebar draws them: 16 px, slightly dimmed. */
.mx-pict { width: var(--mx-icon); height: var(--mx-icon); flex-shrink: 0; }
.mx-node-icon .mx-pict, .mx-level-icon .mx-pict { opacity: var(--mx-icon-dim); }
.mx-tree-button { width: var(--mx-tree-slot); height: var(--mx-tree-slot); border: 0; padding: 0; border-radius: var(--mx-radius-sm); background: transparent; color: var(--mx-muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.mx-tree-button:hover { background: var(--mx-hover); color: var(--mx-ink); }
/* The head of an entered level (spec 085, FR-006): the node itself, its icon and title across the whole width. */
.mx-level-head { flex-shrink: 0; display: flex; align-items: center; gap: var(--mx-space-3); margin-top: calc(var(--mx-space-3) + var(--mx-space-2)); min-height: calc(var(--mx-tree-group) + var(--mx-line-width)); line-height: 1.35; padding: 0 var(--mx-space-4) 0 calc((var(--mx-tree-slot) - var(--mx-icon-lg)) / 2); border-bottom: var(--mx-line-width) solid var(--mx-line-2); font-size: var(--mx-text-md); font-weight: var(--mx-weight-bold); min-width: 0; }
.mx-level-icon { width: var(--mx-icon-lg); display: inline-flex; align-items: center; justify-content: center; color: var(--mx-muted); flex-shrink: 0; }
.mx-level-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mx-tree.collapsed .mx-level-head { display: none; }
.mx-tree-scroll { flex: 1; overflow-y: auto; padding: var(--mx-space-3) var(--mx-space-4) var(--mx-space-2); }
.mx-tree-foot { padding: var(--mx-space-2) var(--mx-space-4) var(--mx-space-4); }
.mx-tree-empty { margin: var(--mx-space-6); font-size: var(--mx-text-sm); color: var(--mx-faint); line-height: 1.5; border: var(--mx-line-width) dashed var(--mx-line-3); border-radius: var(--mx-radius-md); padding: var(--mx-space-5); text-align: center; }
.mx-node { display: flex; align-items: center; min-width: 0; min-height: var(--mx-tree-row); border-radius: var(--mx-radius-sm); color: var(--mx-ink-2); font-size: var(--mx-text-md); line-height: 1.35; text-decoration: none; cursor: pointer; padding-right: var(--mx-space-4); border: 0; background: none; width: 100%; text-align: left; }
.mx-node:hover { background: var(--mx-hover); }
.mx-node.on, .mx-node.on:hover { background: var(--mx-selected); font-weight: var(--mx-weight-medium); }
.mx-node.top { min-height: var(--mx-tree-group); font-weight: var(--mx-weight-bold); margin-top: var(--mx-space-2); }
.mx-node-fold, .mx-node-icon { width: var(--mx-icon-lg); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--mx-muted); }
.mx-node-fold.shut { transform: rotate(-90deg); }
.mx-node-icon { margin-right: var(--mx-space-3); }
/* Root entries have no empty branch gutter; their icons share the collapse icon's right edge. */
.mx-tree-root { padding-left: calc((var(--mx-tree-slot) - var(--mx-icon-lg)) / 2); }
.mx-tree-root .mx-node.top > .mx-node-fold:empty { display: none; }
.mx-node-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A node that is entered carries "›" on its right instead of the arrow (spec 085, FR-002): one click makes a level. */
.mx-node-enter { color: var(--mx-faint); font-size: var(--mx-text-lg); line-height: 1; padding-left: var(--mx-space-2); }
.mx-node-note { font-size: var(--mx-text-sm); color: var(--mx-faint); padding: var(--mx-space-2) var(--mx-space-4); display: flex; align-items: center; gap: var(--mx-space-4); }
.mx-node-note.bad { color: var(--mx-bad); }
.mx-node-note button { border: 0; background: none; color: var(--mx-ink-3); text-decoration: underline; cursor: pointer; font-size: inherit; padding: 0; }
.mx-scrim { position: fixed; inset: 0; background: var(--mx-line-3); z-index: 55; }

/* the right panel */
.mx-panel { flex: 1; min-width: 0; position: relative; background-color: var(--mx-canvas); background-image: radial-gradient(var(--mx-dot) var(--mx-dot-size), transparent var(--mx-dot-size)); background-size: var(--mx-dot-step) var(--mx-dot-step); overflow: hidden; }
.mx-panel-own { position: absolute; inset: 0; overflow: auto; }
.mx-panel-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
/* A page that has not said panel.ready is see-through, never hidden: a hidden frame gets no animation frames, and
   React reveals a streamed page in one, so it would never become ready. */
.mx-panel-frame.waiting { opacity: 0; }
.mx-unframed { position: absolute; left: 0; right: 0; top: 0; z-index: 40; padding: var(--mx-space-3) var(--mx-space-5); background: var(--mx-bad); color: var(--mx-on-ink); font-size: var(--mx-text-md); font-weight: var(--mx-weight-bold); text-align: center; }
.mx-panel-note { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); text-align: center; color: var(--mx-muted); font-size: var(--mx-text-md); line-height: 1.55; max-width: 90%; }
.mx-panel-note b { display: block; color: var(--mx-ink-2); font-size: var(--mx-text-lg); }
.mx-panel-note .mx-big { font-size: var(--mx-text-huge); font-weight: var(--mx-weight-heavy); color: var(--mx-line-3); }
.mx-panel-note a, .mx-panel-note button { display: inline-block; margin-top: var(--mx-space-5); padding: var(--mx-space-3) var(--mx-space-5); border-radius: var(--mx-radius-md); background: var(--mx-ink); color: var(--mx-on-ink); font-size: var(--mx-text-md); text-decoration: none; border: 0; cursor: pointer; }

/* Side by side (spec 079, FR-019): two panels, A on the left and B on the right, each with its head. */
.mx-halves { display: flex; width: 100%; height: 100%; }
.mx-half { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; position: relative; }
.mx-half + .mx-half { border-left: var(--mx-line-width) solid var(--mx-line-3); }
.mx-half-head { flex-shrink: 0; height: var(--mx-side-head); display: flex; align-items: center; gap: var(--mx-space-4); padding: 0 var(--mx-space-5); font-size: var(--mx-text-scale); color: var(--mx-ink-3); background: var(--mx-surface); border-bottom: var(--mx-line-width) solid var(--mx-line); }
.mx-half-head b { flex: 1; min-width: 0; color: var(--mx-ink); font-weight: var(--mx-weight-bold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mx-half-side { font-weight: var(--mx-weight-heavy); }
.mx-half-side.a { color: var(--mx-side-a); }
.mx-half-side.b { color: var(--mx-side-b); }
.mx-track-switch { flex-shrink: 0; height: var(--mx-icon-lg); padding: 0 var(--mx-space-4); font: inherit; font-size: var(--mx-text-sm); font-weight: var(--mx-weight-bold); border: 0; border-radius: var(--mx-radius-sm); color: var(--mx-muted); background: transparent; cursor: pointer; }
.mx-track-switch.on { color: var(--mx-side-b); background: var(--mx-track-on); }
.mx-flip { display: none; gap: var(--mx-space-1); padding: var(--mx-space-1); border: var(--mx-line-width) solid var(--mx-line-3); border-radius: var(--mx-radius-md); flex-shrink: 0; }
.mx-flip button { width: var(--mx-row); height: var(--mx-icon-lg); border: 0; border-radius: var(--mx-radius-sm); font: inherit; font-size: var(--mx-text-scale); font-weight: var(--mx-weight-heavy); color: var(--mx-ink-3); background: transparent; cursor: pointer; }
.mx-flip button.a.on { background: var(--mx-side-a); color: var(--mx-on-ink); }
.mx-flip button.b.on { background: var(--mx-side-b); color: var(--mx-on-ink); }
.mx-half-body { flex: 1; min-height: 0; position: relative; }
.mx-half-note { position: absolute; top: var(--mx-space-5); left: 50%; transform: translateX(-50%); z-index: 20; padding: var(--mx-space-2) var(--mx-space-5); border-radius: var(--mx-radius-md); font-size: var(--mx-text-pill); font-weight: var(--mx-weight-bold); color: var(--mx-on-ink); background: var(--mx-note); white-space: nowrap; pointer-events: none; }
.mx-half-note code { font-family: var(--mx-mono); font-size: var(--mx-text-scale); background: var(--mx-note-code); padding: 0 var(--mx-space-2); border-radius: var(--mx-radius-xs); }

@media (max-width: 520px) {
  .mx-burger { display: inline-flex; }
  .mx-logo-name, .mx-path-step:not(:last-child), .mx-path-sep { display: none; }
  /* The pill fills the row, as the mockup of spec 074 draws a phone: the organization and the crumbs give way to it. */
  .mx-org, .mx-path { display: none; }
  .mx-slot-moment { flex: 1; min-width: 0; max-width: none; margin: 0 var(--mx-space-1); }
  /* One panel of Side by side at a time, with its A / B switch; the other stays drawn under it, so its page keeps its
     place and stays ready to bring what was chosen. */
  .mx-halves { position: relative; }
  .mx-half { position: absolute; inset: 0; }
  .mx-half:not(.phone-shown) { visibility: hidden; }
  .mx-half + .mx-half { border-left: 0; }
  .mx-flip { display: inline-flex; }
  .mx-half-side { display: none; }
  .mx-body > .mx-tree { display: none; }
  .mx-tree.drawer { display: flex; position: fixed; z-index: 60; top: var(--mx-top-row); left: 0; bottom: 0; width: var(--mx-drawer-width); box-shadow: var(--mx-shadow-pop); }
  .mx-node { min-height: var(--mx-tree-row-phone); font-size: var(--mx-text-lg); }
  .mx-level-head { font-size: var(--mx-text-lg); }
  .mx-menu, .mx-menu.left { width: auto; left: var(--mx-space-5); right: var(--mx-space-5); }
}

/* The time scale's pill, as the core's scale.css draws it, copied as it is. */
.mx-pill { height: var(--mx-pill-height); display: inline-flex; align-items: center; border-radius: var(--mx-radius-md); background: var(--mx-pill); min-width: 0; }
.mx-pill.open { background: var(--mx-pill-open); }
.mx-pill-main { height: var(--mx-pill-height); border: 0; background: none; display: inline-flex; align-items: center; gap: var(--mx-space-3); padding: 0 var(--mx-space-3) 0 var(--mx-space-4); font: inherit; font-size: var(--mx-text-pill); color: var(--mx-pill-ink); cursor: pointer; white-space: nowrap; min-width: 0; border-radius: var(--mx-radius-md); }
.mx-pill-main:hover { background: var(--mx-hover); }
.mx-pill-name { color: var(--mx-ink); font-weight: var(--mx-weight-bold); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mx-pill-live, .mx-pill-past { width: var(--mx-mark); height: var(--mx-mark); border-radius: var(--mx-radius-round); flex-shrink: 0; }
.mx-pill-live { background: var(--mx-live); box-shadow: 0 0 0 var(--mx-ring-wide) var(--mx-live-ring); }
.mx-pill-past { background: var(--mx-past); }
.mx-pill-icon { width: var(--mx-icon); height: var(--mx-icon); flex-shrink: 0; color: var(--mx-muted); }
.mx-pill-arrow { width: var(--mx-pill-arrow-width); height: var(--mx-pill-height); border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--mx-pill-arrow); flex-shrink: 0; border-radius: var(--mx-radius-md); }
.mx-pill-arrow .mx-pill-icon { color: inherit; }
.mx-pill-arrow:hover:not(:disabled) { background: var(--mx-hover); color: var(--mx-ink); }
.mx-pill-arrow:disabled { color: var(--mx-pill-off); cursor: default; }
.mx-pill-hairline { width: var(--mx-line-width); height: var(--mx-pill-hairline-height); background: var(--mx-pill-hairline); flex-shrink: 0; }
.mx-pill-now { border: 0; background: none; font: inherit; font-size: var(--mx-text-scale); color: var(--mx-now-link); font-weight: var(--mx-weight-bold); padding: 0 var(--mx-space-4); height: var(--mx-pill-height); cursor: pointer; white-space: nowrap; }

.mx-pill-ab { font-weight: var(--mx-weight-bold); color: var(--mx-pill-arrow); margin-right: var(--mx-space-1); }
.mx-pill-to { color: var(--mx-muted); margin: 0 var(--mx-space-2); font-weight: var(--mx-weight-medium); }
.mx-pill-mode { font-weight: var(--mx-weight-medium); color: var(--mx-pill-arrow); }
.mx-pill-counts { display: inline-flex; gap: var(--mx-space-2); font-weight: var(--mx-weight-bold); margin-left: var(--mx-space-2); flex-shrink: 0; }
.mx-pill-none { color: var(--mx-muted); margin-left: var(--mx-space-2); flex-shrink: 0; }

  /* ---------- issue #13: the frame as the core draws it, its pages, tables and cards ---------- */
  /* Inside the device the frame fills the device under the address bar, and what is fixed on a real screen is absolute here. */
  .device .mx-frame { height: auto; flex: 1; min-height: 0; }
  .device .mx-veil, .device .mx-scrim { position: absolute; }
  .device .mx-tree.drawer { position: absolute; }
  .mx-panel-own > .page { min-height: 100%; }
  .mx-top .mx-menu-item { cursor: pointer; }
  .ico.sm { width: 14px; height: 14px; }

  /* The core's own page in the panel: the look of Settings → Plugins (globals.css of the core). */
  .page { flex: 1; overflow-y: auto; background: var(--canvas); padding: 26px 32px 48px; }
  .page .inner { max-width: 960px; margin: 0 auto; }
  .ph { display: flex; align-items: flex-start; gap: 16px; }
  .ph .tx { flex: 1; }
  .ph h2 { font-size: 22px; margin: 0 0 4px; }
  .ph .sub { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .ph .sub b { color: var(--ink); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 16px; }
  .tabs button { border: 0; background: none; padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .tabs .cnt { font-size: 11px; background: #e2e8f0; color: #475569; border-radius: 9px; padding: 0 6px; font-weight: 600; }
  .search { display: flex; align-items: center; gap: 8px; height: 36px; border: 1px solid rgba(15,23,42,.18); border-radius: 8px; background: #fff; padding: 0 10px; margin-bottom: 14px; max-width: 420px; color: var(--muted); font-size: 13.5px; }
  .sec { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; display: flex; align-items: center; gap: 8px; }
  .sec span { text-transform: none; letter-spacing: 0; font-weight: 400; }

  /* The table of users and of invitations: the table of spec 059's administration. */
  table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 12.5px; }
  .tbl th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 9px 12px; background: #f8fafc; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line2); vertical-align: middle; color: var(--ink2); }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: #f8fafc; }
  .tbl tr.on td { background: #f1f5f9; }
  .tbl tr.gone td { color: var(--faint); }
  .tbl tr.gone .who .av { opacity: .5; }
  .tbl .nm { font-weight: 600; color: var(--ink); }
  .tbl .em { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .tbl .mut { color: var(--muted); }
  .tbl .wr { white-space: normal; }
  .tbl .acts2 { display: flex; gap: 6px; justify-content: flex-end; }
  .tbl .mx-button { height: 26px; font-size: 12px; padding: 0 9px; }
  .who { display: inline-flex; align-items: center; gap: 8px; }
  .who .av { width: 24px; height: 24px; border-radius: 50%; background: #e2e8f0; font-size: 9.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; color: #334155; flex-shrink: 0; }
  .stt { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .st-active { background: #dcfce7; color: #166534; } .st-blocked { background: #fee2e2; color: #991b1b; }
  .st-sent { background: #fef3c7; color: #92400e; } .st-accepted { background: #dcfce7; color: #166534; } .st-declined { background: #fee2e2; color: #991b1b; }
  .st-withdrawn { background: #f1f5f9; color: #475569; } .st-expired { background: #f1f5f9; color: #94a3b8; }
  .badge.adm { background: #ede9fe; color: #5b21b6; }
  .badge.usr { background: #f1f5f9; color: #475569; font-weight: 500; }

  /* The card of a user or an invitation: a drawer on the right of the panel, as in spec 059. */
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 430px; background: #fff; border-left: 1px solid var(--line); box-shadow: -12px 0 30px rgba(15,23,42,.08); z-index: 15; display: flex; flex-direction: column; }
  .dh { padding: 14px 18px 12px; border-bottom: 1px solid var(--line2); }
  .dh .dk { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .dh .dk .close { cursor: pointer; font-size: 16px; color: var(--muted); }
  .dh h3 { font-size: 16px; margin: 6px 0 4px; line-height: 1.3; word-break: break-all; }
  .dh .dt { font-size: 12.5px; color: #475569; line-height: 1.45; }
  .life { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .life span { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: #f1f5f9; color: var(--faint); }
  .life span.on { background: #0f172a; color: #fff; font-weight: 600; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .db { flex: 1; overflow-y: auto; padding: 12px 18px 18px; }
  .kv { display: grid; grid-template-columns: 118px 1fr; gap: 8px 10px; font-size: 12.5px; margin-bottom: 14px; }
  .kv .k { color: var(--muted); }
  .kv .v { color: var(--ink2); line-height: 1.4; }
  .kv .v .lnk2 { color: #1d4ed8; cursor: pointer; }
  .kv .v .lnk2:hover { text-decoration: underline; }
  .df { border-top: 1px solid var(--line2); padding: 10px 18px; font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; }
  .hintb { font-size: 12px; line-height: 1.45; border-left: 3px solid #93c5fd; background: #eff6ff; color: #1e3a8a; padding: 8px 10px; border-radius: 0 6px 6px 0; margin: 10px 0; }
  .hintb.warn2 { border-color: #fdba74; background: #fff7ed; color: #7c2d12; }
  .hintb.bad2 { border-color: #fca5a5; background: #fef2f2; color: #7f1d1d; }
  .fine2 { font-size: 11.5px; color: var(--muted); line-height: 1.45; margin: 6px 0 4px; }
  .tg { width: 30px; height: 18px; border-radius: 9px; background: #cbd5e1; position: relative; display: inline-block; cursor: pointer; flex-shrink: 0; vertical-align: middle; transition: background .15s; }
  .tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.25); transition: left .15s; }
  .tg.on { background: #0f172a; } .tg.on::after { left: 14px; }
  .tg.dis { opacity: .4; cursor: not-allowed; }
  .mx-button.dangerf { background: #b91c1c; border-color: #b91c1c; color: #fff; font-weight: 600; }
  .mx-button .ico { flex-shrink: 0; }
  .arow { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; font-size: 12.5px; color: var(--ink2); background: #fff; }
  .arow > .ico { color: var(--muted); flex-shrink: 0; }
  .arow .an { flex: 1; min-width: 0; }
  .arow .as { font-size: 11px; color: var(--muted); margin-top: 1px; line-height: 1.4; }
  .arow .ad { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  /* The setting "Who may invite": two rows, one chosen. */
  .choice { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .choice:hover { border-color: rgba(15,23,42,.3); }
  .choice.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .choice .rad { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(15,23,42,.35); flex-shrink: 0; margin-top: 1px; display: inline-flex; align-items: center; justify-content: center; }
  .choice.on .rad { border-color: var(--ink); }
  .choice.on .rad::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
  .choice b { font-size: 13.5px; display: block; }
  .choice div { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
  .choice .now { font-size: 11px; color: var(--ok); font-weight: 600; margin-top: 4px; }
  .orgkv { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }

  /* Invitations on the screen of choosing an organization. */
  .pick .dsec { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .orow.inv { cursor: default; }
  .orow.inv:hover { border-color: var(--line); box-shadow: none; }
  .orow.inv .on div { line-height: 1.45; }
  .orow .ia { display: flex; gap: 6px; flex-shrink: 0; }
  .pick .alert { margin-bottom: 16px; }

  /* The frame on a phone: the tree in a drawer behind the burger; a dialog as a sheet; a table as rows. */
  .device.phone .mx-burger { display: inline-flex; }
  .device.phone .mx-logo-name, .device.phone .mx-org, .device.phone .mx-path { display: none; }
  .device.phone .mx-slot-moment { flex: 1; margin: 0 var(--mx-space-1); }
  .device.phone .mx-pill { flex: 1; }
  .device.phone .mx-pill-main { flex: 1; justify-content: flex-start; }
  .device.phone .mx-pill, .device.phone .mx-pill-main, .device.phone .mx-pill-arrow { height: var(--mx-pill-height-phone); }
  .device.phone .mx-pill-arrow { width: var(--mx-pill-arrow-phone); }
  .device.phone .mx-body > .mx-tree { display: none; }
  .device.phone .mx-body > .mx-tree.drawer { display: flex; position: absolute; inset: 0 auto 0 0; width: var(--mx-drawer-width); z-index: 60; background: var(--mx-sidebar); box-shadow: var(--mx-shadow-pop); }
  .device.phone .page { padding: 16px 14px 32px; }
  .device.phone .ph { flex-direction: column; gap: 10px; }
  .device.phone .tabs button { flex: 1; justify-content: center; }
  .device.phone .search { max-width: none; height: 44px; }
  .device.phone .dlg { top: auto; bottom: 0; left: 0; right: 0; transform: none; width: auto; max-height: 88%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 16px 22px; border: 0; }
  .device.phone .dlg .ft { flex-direction: column-reverse; gap: 8px; }
  .device.phone .dlg .ft .mx-button { width: 100%; justify-content: center; height: 46px; font-size: 15px; }
  .device.phone .pick { padding: 20px 12px; }
  .device.phone .pick .inner { width: 100%; }
  .device.phone .orow.inv { flex-wrap: wrap; }
  .device.phone .orow.inv .ia { width: 100%; }
  .device.phone .orow.inv .ia .mx-button { flex: 1; justify-content: center; height: 40px; }
  .device.phone table.tbl thead { display: none; }
  .device.phone table.tbl, .device.phone table.tbl tbody, .device.phone table.tbl tr, .device.phone table.tbl td { display: block; }
  .device.phone table.tbl td { border: 0; }
  .device.phone table.tbl tr { padding: 8px 0; border-bottom: 1px solid var(--line2); }
  .device.phone table.tbl tr:last-child { border-bottom: 0; }
  .device.phone table.tbl td:empty { display: none; }
  .device.phone .drawer { width: 100%; }
  .device.phone .urlbar .u, .device.phone .urlbar .u b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .device.phone table.tbl td { display: inline-block; padding: 2px 4px 2px 12px; }
  .device.phone table.tbl td:first-child { display: block; }

/* BEGIN shared administration canvas */
/* @maxitor/tokens — Maxitor's look as CSS custom properties.
   The core's frame, its controls and every plugin's page take colours and sizes only from here, so all of Maxitor
   looks the same and a later dark theme changes one file. The values are those of Maxitor's screens today: the
   core's application (mockups 059, 072, 073) and the graph viewer's floating panels. */
:root {
  /* Ink and surfaces. */
  --mx-ink: #0f172a;
  --mx-ink-2: #1e293b;
  --mx-ink-3: #334155;
  --mx-muted: #64748b;
  --mx-faint: #94a3b8;
  --mx-on-ink: #ffffff;
  --mx-surface: #ffffff;
  --mx-surface-glass: rgba(255, 255, 255, 0.88);
  --mx-page: #e9edf1;
  --mx-sidebar: #ebf2f5;
  --mx-workspace: #f4f5f7;
  --mx-canvas: #f4f5f7;
  --mx-dot: rgba(160, 168, 180, 0.42);
  --mx-line: rgba(15, 23, 42, 0.1);
  --mx-line-2: rgba(15, 23, 42, 0.06);
  --mx-line-3: rgba(15, 23, 42, 0.14);
  --mx-hover: rgba(15, 23, 42, 0.06);
  --mx-selected: rgba(15, 23, 42, 0.09);
  --mx-ok: #16a34a;
  --mx-bad: #b91c1c;
  --mx-bad-line: #fecaca;
  --mx-disk-line: rgba(0, 0, 0, 0.12);
  --mx-warn: #b45309;

  /* The palette: the colours a plugin names in navigation.yaml (colour: green), never by code. */
  --mx-palette-grey: #94a3b8;
  --mx-palette-blue: #2563eb;
  --mx-palette-green: #16a34a;
  --mx-palette-amber: #d97706;
  --mx-palette-red: #dc2626;
  --mx-palette-violet: #7c3aed;
  --mx-palette-teal: #0d9488;
  --mx-palette-pink: #db2777;

  /* Radii. */
  --mx-radius-xs: 4px;
  --mx-radius-sm: 6px;
  --mx-radius-md: 8px;
  --mx-radius-lg: 12px;
  --mx-radius-round: 999px;

  /* Shadows and blur. */
  --mx-shadow-disk: inset 0 0 0 var(--mx-ring) var(--mx-surface), 0 0 0 var(--mx-line-width) var(--mx-disk-line);
  --mx-shadow-float: 0 2px 10px rgba(0, 0, 0, 0.07);
  --mx-shadow-card: 0 8px 30px rgba(15, 23, 42, 0.08);
  --mx-shadow-pop: 0 12px 32px rgba(15, 23, 42, 0.16);
  --mx-blur: blur(8px);

  /* Type. */
  --mx-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mx-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --mx-text-xs: 10.5px;
  --mx-text-sm: 11.5px;
  --mx-text-md: 13px;
  --mx-text-lg: 14px;
  --mx-text-xl: 19px;
  --mx-text-tiny: 10px;
  --mx-weight-medium: 500;
  --mx-weight-bold: 600;
  --mx-weight-heavy: 700;
  --mx-tracking-caps: 0.05em;

  /* Spacing and sizes of the frame. */
  --mx-space-1: 2px;
  --mx-space-2: 4px;
  --mx-space-3: 6px;
  --mx-space-4: 8px;
  --mx-space-5: 12px;
  --mx-space-6: 16px;
  --mx-space-7: 24px;
  --mx-line-width: 1px;
  --mx-control: 28px;
  --mx-action-height: 36px;
  --mx-action-height-phone: 44px;
  --mx-control-sm: 22px;
  --mx-row: 30px;
  --mx-icon: 16px;
  --mx-icon-sm: 14px;
  --mx-top-row: 44px;
  --mx-tree-width: 255px;
  --mx-filter-width: 148px;
  --mx-filter-pad: 10px;
  --mx-badge: 20px;
  --mx-text-badge: 8px;
  --mx-bar-button: 30px;
  --mx-bar-hairline: 22px;
  --mx-empty-width: 520px;
  --mx-card-min: 230px;
  --mx-empty-pad-y: 34px;
  --mx-empty-pad-x: 20px;
  --mx-dashed-width: 1.5px;
  /* The shell's layer over a page's own content: a plugin's page stays below it (spec 078, FR-019). */
  --mx-layer-shell: 30;
  --mx-layer-shell-pop: 35;
  --mx-dot-step: 20px;
  --mx-dot-size: 1px;
  --mx-icon-lg: 20px;
  --mx-ring: 2px;
  --mx-tree-row: 32px;
  --mx-tree-group: 36px;
  --mx-tree-slot: 32px;
  --mx-tree-row-phone: 42px;
  --mx-menu-width: 290px;
  --mx-drawer-width: 296px;
  --mx-text-huge: 56px;
  --mx-phone: 520px;

  /* The date pickers (spec 081): Apple's layout in Maxitor's colours, as the mockup of spec 079 draws them. */
  --mx-band: #eef2f7;
  --mx-cal-side: #f8fafc;
  --mx-cal-accent: #475569;
  --mx-cal-link: #2563eb;
  --mx-cal-off: #d6dde6;
  --mx-scrim: rgba(15, 23, 42, 0.32);
  --mx-cal-presets: 150px;
  --mx-cal-main: 470px;
  --mx-cal-main-one: 270px;
  --mx-cal-cell: 30px;
  --mx-cal-cell-phone: 40px;
  --mx-cal-day: 28px;
  --mx-cal-field: 32px;
  --mx-cal-wheels: 196px;
  --mx-cal-wheel-row: 28px;
  --mx-cal-wheel-pad: 84px;
  --mx-sheet-radius: 16px;

  /* A comparison's marks, as the graph's ERD draws them (maxitor-web lib/erdPostPass.ts): the change's colour, a soft
     halo of it under what changed — 40 px round it, fill-opacity 0.16, blurred by 22 — and what did not change faded. */
  --mx-change-added: var(--mx-palette-green);
  --mx-change-changed: var(--mx-palette-amber);
  --mx-change-removed: var(--mx-palette-red);
  --mx-change-unchanged: var(--mx-palette-grey);
  --mx-halo-blur: 44px;
  --mx-halo-spread: 34px;
  --mx-halo-strength: 16%;
  --mx-faded: 0.32;
  /* A filter's row with nothing of its kind on the page fades its label only (maxitor-web ErdFilterPanel RowLabel). */
  --mx-absent: 0.4;
  /* The sign in a status disk (maxitor-web lib/erdFilterPresence.ts: 14 of 24 units on a disk of 20). */
  --mx-text-sign: 12px;
  /* A tree's pictogram, as the graph viewer's SidebarRowIcon dims it. */
  --mx-icon-dim: 0.88;

  /* The time scale (spec 079): the graph viewer's VersionButton and VersionPicker, and the mockup of spec 074. */
  --mx-pill: rgba(15, 23, 42, 0.05);
  --mx-pill-open: rgba(15, 23, 42, 0.1);
  --mx-pill-ink: #334155;
  --mx-pill-arrow: #475569;
  --mx-pill-off: #cbd5e1;
  --mx-pill-hairline: rgba(15, 23, 42, 0.12);
  --mx-pill-height: 28px;
  --mx-pill-height-phone: 34px;
  --mx-pill-arrow-width: 26px;
  --mx-pill-arrow-phone: 34px;
  --mx-pill-hairline-height: 16px;
  --mx-text-pill: 12.5px;
  --mx-text-scale: 12px;
  --mx-live: #16a34a;
  --mx-live-ring: rgba(22, 163, 74, 0.15);
  --mx-past: #2563eb;
  --mx-now-link: #1d4ed8;
  --mx-mark: 7px;
  --mx-ring-wide: 3px;
  --mx-scale-gap: 11px;
  --mx-scale-card: 760px;
  --mx-scale-card-radius: 10px;
  --mx-scale-pad-top: 14px;
  --mx-scale-pad-x: 20px;
  --mx-scale-pad-bottom: 12px;
  --mx-scale-edge: 10px;
  --mx-shadow-scale: 0 12px 40px rgba(15, 23, 42, 0.16), 0 1px 2px rgba(15, 23, 42, 0.06);
  --mx-shadow-tip: 0 8px 30px rgba(15, 23, 42, 0.14), 0 1px 2px rgba(15, 23, 42, 0.06);
  --mx-scale-hatch: #e2e8f0;
  --mx-scale-axis: #cbd5e1;
  --mx-scale-day: rgba(15, 23, 42, 0.09);
  --mx-scale-hour: rgba(15, 23, 42, 0.04);
  --mx-scale-range: rgba(15, 23, 42, 0.06);
  --mx-scale-brush: rgba(37, 99, 235, 0.12);
  --mx-scale-brush-line: #2563eb;
  --mx-zoom-height: 22px;
  --mx-zoom-height-phone: 30px;
  --mx-zoom-radius: 7px;
  --mx-zoom-inner-radius: 5px;
  --mx-modes-height: 24px;
  --mx-modes-height-phone: 32px;
  --mx-text-axis: 10.5px;
  --mx-sheet-grab: 40px;
  --mx-sheet-grab-height: 5px;
  --mx-sheet-height: 86%;

  /* The milestones' palette, as the graph viewer's track and the mockup of spec 074 draw it: a point's colour, the tint
     of its badge and the ink of the badge's words. */
  --mx-tone-neutral: #8c959f;
  --mx-tone-neutral-tint: #f6f8fa;
  --mx-tone-neutral-ink: #59636e;
  --mx-tone-purple: #8250df;
  --mx-tone-purple-tint: #fbefff;
  --mx-tone-purple-ink: #8250df;
  --mx-tone-blue: #0969da;
  --mx-tone-blue-tint: #ddf4ff;
  --mx-tone-blue-ink: #0969da;
  --mx-tone-green: #1a7f37;
  --mx-tone-green-tint: #dafbe1;
  --mx-tone-green-ink: #1a7f37;
  --mx-tone-amber: #9a6700;
  --mx-tone-amber-tint: #fff8c5;
  --mx-tone-amber-ink: #9a6700;
  --mx-tone-red: #d1242f;
  --mx-tone-red-tint: #ffebe9;
  --mx-tone-red-ink: #d1242f;
  --mx-chip-bg: #f1f5f9;
  --mx-message-bg: #f8fafc;
  --mx-scale-tip: 270px;
  --mx-scale-card-tip: 320px;
  --mx-scale-grid: rgba(15, 23, 42, 0.05);
  --mx-badge-height: 22px;
  --mx-badge-icon: 13px;
  --mx-badge-outline: 1.2px;
  --mx-message-max: 120px;
  --mx-text-card-title: 13.5px;
  --mx-legend-width: 640px;
  --mx-legend-keys: 200px;

  /* An element another panel points at: a blue glow, as the mockup of spec 079 draws it. */
  --mx-glow: 5px;
  --mx-glow-colour: rgba(37, 99, 235, 0.95);
  --mx-glow-line: #2563eb;
  --mx-glow-tint: rgba(37, 99, 235, 0.12);
  /* Side by side: A brown, B blue, as the graph viewer's two panels name them. */
  --mx-side-a: #b45309;
  --mx-side-b: #1d4ed8;
  --mx-side-head: 30px;
  --mx-track-on: rgba(37, 99, 235, 0.1);
  --mx-note: rgba(15, 23, 42, 0.86);
  --mx-note-code: rgba(255, 255, 255, 0.14);

  /* What a page compares with: the graph viewer's DiffCard, StatusIcon and ChangeStepper. */
  --mx-text-status: 9px;
  --mx-diff-card: 300px;
  --mx-stepper-list: 340px;
  --mx-stepper-height: 360px;
}

/* Stable typography in live forms and historical views, independent of camera transforms. */
.device .page { min-height: 0; height: auto; padding: 0; background: transparent; overflow: visible; }
.device .page .inner { width: 100%; max-width: 1100px; padding: 0; margin: 0 auto; }
.device h2, .device .page h2 { font-size: 20px; line-height: 1.3; margin: 0 0 12px; }
.device h3, .device .panel h3, .device .dlg h3 { font-size: 16px; line-height: 1.4; }
.device :is(.sub,.choice,.choice b,.choice div,.choice .now,.kv,.utbl,.nm,.arow,.alert,.stt,.tabs button,.mx-button:not([data-variant="link"]),.panel .mx-button:not([data-variant="link"]),.dlg .mx-button:not([data-variant="link"])) { font-size: 14px; line-height: 1.5; }
.device :is(.sec,.fine2,.em,.as,.badge,.lab,.hintl,.mut,.utbl th,.admin-meta) { font-size: 12px; line-height: 1.5; }
.device :is(input,textarea,select,.search input,.inp input) { font-family: inherit; font-size: 16px; line-height: 1.5; }
.device .choice { background: #fff; }
.device .mx-button:not([data-variant="link"]) { min-height: 36px; height: auto; }
.device .dlg { max-height: calc(100dvh - 32px); overflow-y: auto; }
.device .panel { max-width: 100%; }
.admin-history-notice { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 20px; }
.admin-cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,300px),1fr)); gap: 16px; margin-top: 16px; }
.admin-object { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; overflow-wrap: anywhere; }
.admin-object[data-change=added] { border-color: #16a34a; }
.admin-object[data-change=changed] { border-color: #d97706; }
.admin-object[data-change=removed] { border-color: #dc2626; }
.admin-object dl > div { display: grid; grid-template-columns: minmax(100px,1fr) 2fr; gap: 12px; padding: 6px 0; }
.admin-object dd { margin: 0; }
.admin-object dt, .admin-meta { color: var(--muted); }
.admin-change { text-transform: capitalize; }
@media (max-width: 600px) {
  .device .page .inner { width: 100%; padding: 0; }
  .device .ph { flex-wrap: wrap; gap: 12px; }
  .device :is(.mx-button:not([data-variant="link"]),.tabs button) { min-height: 44px; }
  .device .dlg { width: 100%; max-width: 100%; max-height: calc(100dvh - 16px); }
  .device .utbl { width: 100%; }
  .admin-object dl > div { grid-template-columns: 1fr; gap: 2px; }
}

.device.admin-dialog-content { height: auto; }
.device.admin-dialog-content :is(.dlg,.panel,.drawer) { position: static; inset: auto; transform: none; width: 100%; max-width: none; height: auto; max-height: none; padding: 0; margin: 0; border: 0; box-shadow: none; overflow: visible; }
.device.admin-dialog-content :is(.dh,.db,.df,.pb,.pf) { padding: 8px 0; }

.admin-canvas-host { position: absolute; inset: 0; }
.admin-scene { position: absolute; left: 0; top: 0; padding-bottom: 24px; }

.admin-moment { position: relative; display: inline-flex; margin-right: 12px; }
.admin-time-menu { position: absolute; z-index: 100; right: 0; top: 40px; width: min(340px,90vw); padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 8px 24px #0002; }
.admin-time-menu .tabs { display: flex; flex-wrap: wrap; }

/* Both plugin tabs fill the available panel; typography stays independent of layout. */
.device .marketplace-page .inner { max-width: none; container: marketplace / inline-size; }
.device .marketplace-page .inner .grid { display: grid; grid-template-columns: minmax(0,1fr); gap: 10px; }
@container marketplace (min-width: 601px) {
  .device .marketplace-page .inner .grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@container marketplace (min-width: 1150px) {
  .device .marketplace-page .inner .grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
}
.device .marketplace-page .grid > :is(.mcard,.prow) { min-width: 0; margin: 0; border: 1px solid var(--line); border-radius: 10px; padding: 15px 16px; }
.device .marketplace-page .grid > .prow { display: grid; grid-template-columns: 38px minmax(0,1fr); align-content: start; gap: 9px 12px; }
.device .marketplace-page .prow .pacts { grid-column: 1 / -1; justify-content: flex-end; margin-top: auto; }
.device .marketplace-page .grid :is(.pmain,.mono) { min-width: 0; overflow-wrap: anywhere; }

/* Semantic cards share spacing without changing the established type scale. */
.admin-surface { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0 0 16px; box-shadow: 0 2px 6px #0f172a06; min-width: 0; }
.admin-surface-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.admin-surface-head h3 { margin: 0; }
.admin-facts { margin: 0; }
.admin-facts > div { display: grid; grid-template-columns: minmax(120px,1fr) 2fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line2); }
.admin-facts > div:last-child { border-bottom: 0; }
.admin-facts dt { color: var(--muted); }
.admin-facts dd { margin: 0; overflow-wrap: anywhere; }
.admin-policy-options { border: 0; padding: 0; margin: 12px 0; }
.device .choice { display: flex; align-items: flex-start; text-align: left; gap: 12px; padding: 12px; margin: 0; border: 0; border-radius: 7px; box-shadow: none; }
.device .choice.on { background: #f1f5f9; border: 0; box-shadow: none; }
.device .choice:hover { background: #f8fafc; }
.device .choice:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.admin-policy-options input { flex: 0 0 auto; width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--ink); }
.admin-choice-description { display: block; margin-top: 4px; color: var(--muted); }
.admin-people .tabs { margin-top: 0; }
.admin-people :is(.utbl,.tbl) { border: 0; border-radius: 0; }
.admin-people .search { max-width: 100%; }
.admin-people .who > div { min-width: 0; }
.admin-people :is(.em,.nm) { overflow-wrap: anywhere; }
.admin-object { box-shadow: 0 2px 6px #0f172a06; }
@media (max-width: 600px) {
  .admin-surface { padding: 12px; }
  .admin-facts > div { grid-template-columns: 1fr; gap: 4px; }
  .admin-people .tabs { display: flex; }
  .admin-people .tabs button { flex: 1; padding-left: 6px; padding-right: 6px; }
  .admin-people :is(.utbl,.tbl) td { overflow-wrap: anywhere; max-width: 100%; }
}
.device.phone .admin-surface { padding: 12px; }
.device.phone .admin-facts > div { grid-template-columns: 1fr; gap: 4px; }
@media (max-width: 600px) {
  .admin-people :is(.utbl,.tbl) td[data-label] { display: block; padding-top: 4px; }
  .admin-people td[data-label]::before { content: attr(data-label) ": "; }
}
.device.phone .admin-people :is(.utbl,.tbl) td[data-label] { display: block; padding-top: 4px; }
.device.phone .admin-people td[data-label]::before { content: attr(data-label) ": "; }

/* Keep the introduction separate from the first content card. */
.device :is(.organization-page,.people-page) .ph { margin-bottom: 20px; }

.admin-person-link { border: 0; padding: 0; background: transparent; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.admin-user-status { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; }
.admin-user-status .acts { margin: 0; }
.admin-user-card .db { border-top: 0; margin-top: 8px; }
.admin-user-card .kv { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 16px; margin: 12px 0 0; }
.admin-user-card .kv dd { margin: 0; overflow-wrap: anywhere; }
.device .organization-page .inner { max-width: 820px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
.organization-page .ph, .organization-page .admin-surface:first-of-type, .organization-page .alert { grid-column: 1 / -1; }
.organization-page .admin-surface { margin-bottom: 0; }
.organization-page .admin-facts > div { grid-template-columns: minmax(100px,1fr) 2fr; gap: 12px; padding: 6px 0; }
@media (max-width:600px) {
 .device .organization-page .inner { grid-template-columns: 1fr; }
 .admin-user-card .kv { grid-template-columns: 1fr; gap: 6px; }
 .admin-user-card .kv dd { margin-bottom: 8px; }
}
.device.phone .organization-page .inner { grid-template-columns: 1fr; }

.organization-page .admin-surface-head { min-height: 36px; }
@media (max-width:600px) { .organization-page .admin-surface-head { min-height: 44px; } }
.device.phone .organization-page .admin-surface-head { min-height: 44px; }

/* Comparison keeps the directory and dialog geometry; only change decoration differs. */
.admin-people tr[data-change=added], .admin-user-card[data-change=added] { background: #f0fdf4; box-shadow: inset 3px 0 #16a34a; }
.admin-people tr[data-change=changed], .admin-user-card[data-change=changed] { background: #fffbeb; box-shadow: inset 3px 0 #d97706; }
.admin-people tr[data-change=removed], .admin-user-card[data-change=removed] { background: #fef2f2; box-shadow: inset 3px 0 #dc2626; }
.admin-title-value { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.admin-title-form input { width: 100%; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; }
.admin-title-form .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

/* A narrow comparison pane follows the same responsive directory as a phone. */
.people-page { container: people / inline-size; }
@container people (max-width: 700px) {
  .admin-people .utbl, .admin-people .tbl, .admin-people tbody { display: block; width: 100%; }
  .admin-people :is(thead,colgroup) { display: none; }
  .admin-people :is(.utbl,.tbl) tr { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); padding: 12px; border-bottom: 1px solid var(--line2); gap: 8px 12px; }
  .admin-people :is(.utbl,.tbl) td { display: block; width: auto; min-width: 0; padding: 0; border: 0; }
  .admin-people :is(.utbl,.tbl) td:first-child, .admin-people :is(.utbl,.tbl) td[data-label] { grid-column: 1 / -1; }
  .admin-people td[data-label]::before { content: attr(data-label) ": "; }
  .admin-people .who { align-items: flex-start; }
  .admin-people .who > div { flex: 1; }
  .admin-people .tabs { display: flex; }
  .admin-people .tabs button { flex: 1; padding-left: 4px; padding-right: 4px; }
}
.admin-people .utbl .admin-person-link { height: auto; padding: 0; font-size: inherit; white-space: normal; }

/* User columns keep their width on the canvas, including in comparison panes. */
.device .admin-people table.user-directory { display: table; table-layout: fixed; width: 100%; }
.device .admin-people table.user-directory colgroup { display: table-column-group; }
.device .admin-people table.user-directory thead { display: table-header-group; }
.device .admin-people table.user-directory tbody { display: table-row-group; }
.device .admin-people table.user-directory tr { display: table-row; padding: 0; }
.device .admin-people table.user-directory td { display: table-cell; padding: 12px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.device .admin-people table.user-directory td[data-label]::before { content: none; }

.admin-history-notice { box-sizing: border-box; max-width: var(--admin-visible-width, 100%); }
.device .people-page .inner { max-width: none; }
.admin-people > :is(.tabs,.search) { box-sizing: border-box; max-width: min(100%, calc(var(--admin-visible-width, 1150px) - 32px)); }

.admin-people .user-directory { user-select: none; }

/* Canvas-aware pinning: opaque cells keep the actual name/email and their native actions. */
.user-directory :is(th,td):first-child { position: relative; z-index: 2; transform: translateX(var(--user-pin-offset, 0px)); background: #fff; }
.user-directory th:first-child { background: #f8fafc; z-index: 3; }
.user-directory[data-pinned] :is(th,td):first-child { box-shadow: 3px 0 5px #0f172a18; }
.user-directory tr[data-change=added] td:first-child { background: #f0fdf4; }
.user-directory tr[data-change=changed] td:first-child { background: #fffbeb; }
.user-directory tr[data-change=removed] td:first-child { background: #fef2f2; }
@media (max-width:520px) {
  .user-directory { --user-identity-width: 16%; --user-appeared-width: 30%; }
  .user-directory td:first-child .who { display: flex; }
  .user-directory td:first-child .who > div { min-width: 0; }
  .user-directory td:first-child :is(.nm,.em) { overflow-wrap: anywhere; }
}

/* As in Plugins, tabs and search move and zoom with the canvas content. */
.directory-toolbar { max-width: min(100%, var(--admin-visible-width, 1150px)); }
.directory-toolbar .tabs button { flex: 0 0 auto; }

.device .mx-actions { position: absolute; top: 64px; right: 16px; z-index: 10; display: flex; gap: 8px; }
.device.phone .mx-actions { position: absolute; top: auto; bottom: 56px; }
.mx-action { height: var(--mx-control); padding: 0 var(--mx-space-5); border: 0; border-radius: var(--mx-radius-md); background: var(--mx-ink); color: var(--mx-on-ink); font-size: var(--mx-text-md); cursor: pointer; display: inline-flex; align-items: center; gap: var(--mx-space-3); box-shadow: var(--mx-shadow-float); }
.device .mx-action svg { width: 16px; height: 16px; }
/* Shared by live components and standalone mockups. */
.mx-button.mx-button { box-sizing: border-box; min-height: var(--mx-action-height); border: var(--mx-line-width) solid var(--mx-line); border-radius: var(--mx-radius-md); background: var(--mx-surface); color: var(--mx-ink); padding: var(--mx-space-3) var(--mx-space-5); display: inline-flex; align-items: center; justify-content: center; gap: var(--mx-space-3); font-family: inherit; font-size: var(--mx-text-lg); line-height: 1.5; font-weight: 400; cursor: pointer; text-decoration: none; }
.mx-button[data-variant="primary"], .mx-button.pri { background: var(--mx-ink); color: var(--mx-on-ink); border-color: var(--mx-ink); font-weight: 600; }
.mx-button[data-variant="danger"], .mx-button.danger { color: var(--mx-bad); border-color: var(--mx-bad-line); }
.mx-button.dangerf { background: var(--mx-bad); border-color: var(--mx-bad); color: var(--mx-on-ink); }
.mx-button[data-variant="link"] { min-height: 0; border: 0; background: transparent; padding: 0; font: inherit; color: inherit; text-decoration: underline; text-underline-offset: var(--mx-ring-wide); }
.mx-button[data-variant="icon"] { width: var(--mx-action-height); padding: var(--mx-space-3); border-color: transparent; background: transparent; }
.mx-button:not(:disabled):hover { filter: brightness(.96); }
.mx-button:focus-visible { outline: var(--mx-ring) solid var(--mx-ink); outline-offset: var(--mx-ring-wide); }
.mx-button:disabled, .mx-button.dis { opacity: .45; cursor: not-allowed; }
.mx-button svg { width: var(--mx-icon); height: var(--mx-icon); flex-shrink: 0; }
@media (max-width:600px) { .mx-button.mx-button:not([data-variant="link"]) { min-height: var(--mx-action-height-phone); } }
.device.phone .mx-button:not([data-variant="link"]) { min-height: var(--mx-action-height-phone); }

.mx-button.mx-action { box-shadow: var(--mx-shadow-float); }

/* END shared administration canvas */
/* Shared disk frame: white separation, then the production outer contour. */
.avatar, .av, .mx-avatar, .mx-tip-avatar { box-shadow: inset 0 0 0 2px #fff, 0 0 0 1px rgba(0,0,0,.12); }
img.dk, img.nt-disk, img.pd, img[src*="data-sign"] { border: 1px solid rgba(0,0,0,.12); border-radius: 50%; background: #fff; box-sizing: content-box; }
</style>
</head>
<body>
<aside class="nav" id="nav"></aside>
<main class="stage" id="stage">
  <p class="frame-cap" id="cap"></p>
  <div class="frame-box" id="box"><div class="frame-scale" id="scale"><div class="device" id="app"></div></div></div>
  <div class="notes" id="notes"></div>
</main>

<script>
/* ======================= sample data ======================= */
const PEOPLE = {
  ru: { name: "Anna Kovaleva", ini: "AK", email: "anna.kovaleva@yandex.ru", ip: "95.165.12.40", country: "Russia" },
  ab: { name: "Daniel Weber", ini: "DW", email: "daniel.weber@gmail.com", ip: "84.141.7.213", country: "Germany" },
};
const ORGS = [
  { name: "Severny Veter", code: "severny-veter", color: "#0d9488", admin: true, since: "you registered it" },
  { name: "Lumen Labs", code: "lumen-labs", color: "#7c3aed", admin: false, since: "a user since 3 Nov" },
];
const PROVIDERS = {
  russia: [["ya", "Я", "Yandex ID"], ["mr", "@", "Mail.ru ID"]],
  abroad: [["go", "G", "Google"], ["gh", "", "GitHub"], ["fb", "f", "Facebook"], ["ya", "Я", "Yandex ID"], ["mr", "@", "Mail.ru ID"]],
};

/* ======================= icons ======================= */
const P = (d, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  down: P('<path d="M6 9l6 6 6-6"/>', "ico sm"),
  left: P('<path d="M15 6l-6 6 6 6"/>', "ico sm"),
  mail: P('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
  alert: P('<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>'),
  info: P('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/>'),
  check: P('<path d="M5 12l5 5 9-10"/>', "ico sm"),
  x: P('<path d="M6 6l12 12M18 6L6 18"/>', "ico sm"),
  plus: P('<path d="M12 5v14M5 12h14"/>', "ico sm"),
  out: P('<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>', "ico sm"),
  key: P('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>', "ico sm"),
  swap: P('<path d="M7 7h12l-3-3M17 17H5l3 3"/>', "ico sm"),
  globe: P('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>', "ico sm"),
  gh: '<svg width="12" height="12" viewBox="0 0 16 16" fill="#fff"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>',
};
const pvMark = (k, t) => `<span class="pv ${k}">${k === "gh" ? I.gh : t}</span>`;

/* ======================= state ======================= */
const DEF = { region: "russia", screen: "signin", email: "", codeState: "typing", pop: null, regState: "free", tip: false, refused: null, orgs: 1, linkState: null, next: null, consent: false, cookies: true, pwState: "ok", codeFor: "confirm", resetState: "request", letter: "confirm", signupState: "ok", phone: false,
  // issue #13: who looks (ak — an administrator, os — an ordinary user, dk — the invited person), the frame's page, the open cards, the invite form's case, the setting and the invited person's inbox
  me: "ak", who: null, fpage: "root", utab: "users", usr: null, ivd: null, inv: null, whoInv: "any", switched: false, race: false, ieAdmin: true, again: false, inbox: "none", policy: false, drawer: false, arrived: false };
const S = Object.assign({}, DEF);
function go(patch) { Object.assign(S, patch); render(); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
const ME = () => S.who === "dk" ? DK : PEOPLE[S.region === "russia" ? "ru" : "ab"];

/* ======================= frame parts ======================= */
function urlbar(path) {
  return `<div class="urlbar"><span>🔒</span><span class="u">maxitor.aoa.run<b>${esc(path)}</b></span></div>`;
}
function header() {
  const org = ORGS[0];
  const p = ME();
  return `<div class="hdr">
    <span class="logo"><span class="mk">M</span>Maxitor</span>
    ${S.screen === "nf" ? "" : `<span class="crumb"><span class="ct"><span class="lv">org</span>${esc(org.name)}</span>`}${S.screen === "nf" ? "" : S.orgs > 1 ? `<span class="cvr" onclick="go({pop:S.pop==='orgs'?null:'orgs',tip:false})" title="Your organizations">${I.down}</span>` : ""}${S.screen === "nf" ? "" : "</span>"}
    <span class="spacer"></span>
    <span class="avatar${S.pop === "me" ? " on" : ""}" onmouseenter="go({tip:true})" onmouseleave="go({tip:false})" onclick="go({pop:S.pop==='me'?null:'me',tip:false})">${p.ini}</span>
    ${S.tip && !S.pop ? `<div class="tip">${esc(p.name)}<br><span>${esc(p.email)}</span></div>` : ""}
  </div>`;
}

/* ======================= 1 · signing in ======================= */
function viewSignin() {
  const ru = S.region === "russia";
  const provs = PROVIDERS[S.region].map(([k, t, n]) =>
    `<button data-name="${n}" aria-label="Continue with ${n}" title="Continue with ${n}" onclick="go({screen:'consent',consent:false})">${pvMark(k, t)}</button>`).join("");
  const pw = S.pwState;
  let alert = "";
  if (pw === "wrong") alert = `<div class="alert bad">${I.alert}<div><b>Wrong email or password.</b> Check both, or <a class="lnk" onclick="go({screen:'reset',resetState:'request'})">reset the password</a>.</div></div>`;
  if (pw === "locked") alert = `<div class="alert warn">${I.alert}<div><b>Too many tries for this email.</b> You can try again at <b>14:52</b>, or <a class="lnk" onclick="go({screen:'reset',resetState:'request'})">reset the password</a> now.</div></div>`;
  return `<div class="auth"><div class="card">
    <div class="lg"><span class="mk">M</span>Maxitor</div>
    ${S.next ? `<div class="alert info">${I.info}<div>Sign in to open <b>maxitor.aoa.run${esc(S.next)}</b>. You will land there right after.</div></div>` : ""}
    <h2>Sign in</h2>
    <div class="sub">With your email and password, or with ${ru ? "Yandex ID or Mail.ru ID" : "Google, GitHub, Facebook, Yandex ID or Mail.ru ID"}.</div>
    ${alert}
    <div class="lab">Email</div>
    <div class="inp${pw === "ok" ? "" : " bad"}">${esc(ME().email)}</div>
    <div class="lab">Password <a onclick="go({screen:'reset',resetState:'request'})">Forgot password?</a></div>
    <div class="inp pw${pw === "ok" ? " focus" : " bad"}"><span>••••••••••</span><span class="eye">Show</span></div>
    <button class="btn${pw === "locked" ? " dis" : ""}" onclick="go({screen:'org',pop:null})">Sign in</button>
    <div class="switch-line">No account? <a onclick="go({screen:'signup',signupState:'ok'})">Create one</a></div>
    <div class="or">or continue with</div>
    <div class="icons">${provs}</div>
    ${ru ? `<div class="fine">In Russia Maxitor signs in by email and password, Yandex ID or Mail.ru ID, as Russian law requires.</div>`
      : `<div class="fine">Going to Russia? Google, GitHub and Facebook do not work there. Link your email, Yandex ID or Mail.ru ID in “Sign-in methods” beforehand.</div>`}
    <div class="legal-links"><a onclick="go({screen:'privacy'})">Privacy</a><a onclick="go({screen:'deletion'})">Delete my data</a></div>
  </div></div>`;
}

function viewSignup() {
  const weak = S.signupState === "weak";
  return `<div class="auth"><div class="card">
    <div class="lg"><span class="mk">M</span>Maxitor</div>
    <h2>Create an account</h2>
    <div class="sub">Your email is your login. We send a code to confirm it is yours.</div>
    <div class="lab">Email</div>
    <div class="inp">${esc(ME().email)}</div>
    <div class="lab">Password</div>
    <div class="inp pw ${weak ? "bad" : "focus"}"><span>${weak ? "•••••" : "•••••••••••••"}</span><span class="eye">Show</span></div>
    <div class="hintl${weak ? " bad" : ""}">${weak ? "Too short: at least 10 characters." : "At least 10 characters. Not your email, not a common password."}</div>
    <button class="btn${weak ? " dis" : ""}" onclick="go({screen:'code',codeState:'typing',codeFor:'confirm'})">${I.mail}Continue</button>
    <div class="switch-line">Already have an account? <a onclick="go({screen:'signin',pwState:'ok'})">Sign in</a></div>
    <div class="legal-links"><a onclick="go({screen:'privacy'})">Privacy</a><a onclick="go({screen:'deletion'})">Delete my data</a></div>
  </div></div>`;
}

function viewCode() {
  const st = S.codeState;
  const em = ME().email;
  const digits = st === "typing" ? ["4", "8", "2", "", "", ""] : ["4", "8", "2", "9", "1", "7"];
  const boxes = digits.map((d, i) => `${i === 3 ? '<span class="gap"></span>' : ""}<span class="${st === "typing" && i === 3 ? "cur" : ""}">${d}</span>`).join("");
  let alert = "", btn = `<button class="btn${st === "typing" ? " dis" : ""}" onclick="go({screen:'consent',consent:false})">Confirm</button>`, otpCls = "", resend = `<span>No letter? Check spam.</span><span>Send again in <b>0:42</b></span>`;
  if (st === "wrong") { otpCls = " bad"; alert = `<div class="alert bad">${I.alert}<div><b>The code is wrong.</b> 3 tries are left for this code.</div></div>`; btn = `<button class="btn">Try again</button>`; }
  if (st === "used") { otpCls = " dead"; alert = `<div class="alert bad">${I.alert}<div><b>This code no longer works:</b> it was wrong five times. Ask for a new one — the old one is gone.</div></div>`; btn = `<button class="btn" onclick="go({codeState:'typing'})">${I.mail}Send a new code</button>`; resend = ""; }
  if (st === "expired") { otpCls = " dead"; alert = `<div class="alert warn">${I.alert}<div><b>The code has expired.</b> A code lives ten minutes. Ask for a new one.</div></div>`; btn = `<button class="btn" onclick="go({codeState:'typing'})">${I.mail}Send a new code</button>`; resend = ""; }
  if (st === "limit") { otpCls = " dead"; alert = `<div class="alert warn">${I.alert}<div><b>Too many codes for this address.</b> One address gets ten codes an hour. A new one can be sent at <b>14:52</b>.</div></div>`; btn = `<button class="btn dis">Send a new code at 14:52</button>`; resend = ""; }
  return `<div class="auth"><div class="card">
    <span class="back" onclick="go({screen:'signup',signupState:'ok'})">${I.left}Another email</span>
    <h2>Confirm your email</h2>
    <div class="sub">We sent a six-digit code to <b>${esc(em)}</b>. Enter it to confirm the address is yours. It works for ten minutes.</div>
    ${alert}
    <div class="otp${otpCls}">${boxes}</div>
    ${btn}
    ${resend ? `<div class="resend">${resend}</div>` : ""}
  </div></div>`;
}

function viewRefused() {
  const tried = "Google";
  const provs = PROVIDERS[S.region].map(([k, t, n]) => `<button data-name="${n}" aria-label="Continue with ${n}" title="Continue with ${n}" onclick="go({screen:'consent',consent:false})">${pvMark(k, t)}</button>`).join("");
  return `<div class="auth"><div class="card">
    <div class="lg"><span class="mk">M</span>Maxitor</div>
    <div class="alert bad">${I.globe}<div><b>${tried} does not work from Russia.</b> Russian law allows a person in Russia to sign in only by a Russian service or by the site’s own means.</div></div>
    <h2>Sign in another way</h2>
    <div class="sub">If your account was made with ${tried}, sign in with the email and password, Yandex ID or Mail.ru ID you linked to it.</div>
    <button class="btn" onclick="go({screen:'signin',pwState:'ok'})">${I.mail}Sign in with email and password</button>
    <div class="or">or continue with</div>
    <div class="icons">${provs}</div>
  </div></div>`;
}

/* ======================= 2 · registering an organization ======================= */
function viewNewOrg() {
  const p = ME();
  const s = S.regState;

function sendInvite(email, admin) {
  const id = "n" + Date.now();
  INVITES.unshift({ id, email, job_title:S.invJob || null, by: S.me, admin, st: "sent", sent: "just now", expires: `in ${INV_DAYS} days` });
  if (meAdmin()) go({ pop: null, inv: null, fpage: "users", utab: "invites", ivd: id, usr: null, again: false });
  else go({ inv: "mine" });
}
function resend(id) { go({ ivd: id, usr: null, again: true }); }
function withdraw(id) { const i = INVITES.find(x => x.id === id); i.st = "withdrawn"; i.decided = `just now · by ${VIEWER().name}`; render(); }
function setUser(id, patch) { Object.assign(au(id), patch); if (patch.st === "blocked") au(id).when = "just now · by Anna Kovaleva"; render(); }
function setAdmin(id, on) {
  if (id === "ie") return go({ ieAdmin: on });
  au(id).admin = on;
  // Stepping down yourself: Settings is no longer yours, so the panel returns to the root.
  if (id === S.me && !on) return go({ fpage: "root", usr: null, ivd: null });
  render();
}

  else if (sc === "deletion") html = urlbar("/data-deletion") + viewDeletion();

function stateOf(n) { for (const [, items] of SCREENS) for (const [k, , st] of items) if (k === n) return st; return null; }
function curNum() {
  for (const [, items] of SCREENS) for (const [n, , st] of items) {
    const full = Object.assign({}, DEF, st);
    if (Object.entries(full).every(([k, v]) => S[k] === v)) return n;
  }
  return null;
}
function openNum(n) { go(Object.assign({}, DEF, stateOf(n))); }
function renderNav() {
  const cur = curNum();
  let h = `<h1>Maxitor core: the first people</h1><div class="sub">The exact screens of issues #73 and #13: signing in, registering an organization, the empty frame, sign-in methods, invitations, the organization’s users and who may invite. Every screen is live: buttons lead where the real ones will.</div>`;
  for (const [g, items] of SCREENS) {
    h += `<div class="group">${g}</div>`;
    for (const [n, t] of items) h += `<button class="screen${cur === n ? " on" : ""}" onclick="openNum('${n}')"><span class="n">${n}</span>${t}</button>`;
  }
  h += `<div class="group">Paths</div>`;
  for (const [t, f, steps] of PATHS) h += `<div class="path"><div class="pt">${t}</div><div class="pf">${f}</div><div class="steps">${steps.map(([s, n], i) => `${i ? "<span>→</span>" : ""}<button onclick="openNum('${n}')">${s}</button>`).join("")}</div></div>`;
  document.getElementById("nav").innerHTML = h;
}
function renderNotes() {
  const n = curNum();
  const note = NOTES[n];
  document.getElementById("cap").innerHTML = note ? `<b>${n} · ${note[0]}</b> — the screen is live` : "Free navigation through the mockup";
  document.getElementById("notes").innerHTML = note ? `<h2>${n} · ${note[0]}</h2><ul>${note[1].map(x => `<li>${x}</li>`).join("")}</ul>` : `<h2>Free navigation</h2><ul><li>You got here by moving through the screens themselves.</li></ul>`;
}
function fit() {
  const stage = document.getElementById("stage"), sc = document.getElementById("scale"), box = document.getElementById("box");
  const w = S.phone ? 375 : 1360, h = S.phone ? 812 : 840;
  const k = Math.min(1, (stage.clientWidth - 48) / w);
  sc.style.transform = `scale(${k})`; box.style.height = h * k + "px";
}
window.addEventListener("resize", fit);
document.addEventListener("keydown", e => { if (e.key === "Escape") go({ pop: null, linkState: null, inv: null }); });
/* An address such as index.html?screen=8.1 opens one screen; without it, the first. */
const asked = new URLSearchParams(location.search).get("screen");
if (asked && stateOf(asked)) openNum(asked); else render();
</script>
