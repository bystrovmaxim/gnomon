<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxitor core — signing in, registering an organization, the empty frame · mockup</title>
<style>
  /* The visual language of spec 059's mockup and of today's Maxitor: the same colours, rows and cards. */
  :root {
    --page-bg: #e9edf1; --ink: #0f172a; --ink2: #1e293b; --muted: #64748b; --faint: #94a3b8;
    --line: rgba(15,23,42,.1); --line2: rgba(15,23,42,.06);
    --sidebar: #EBF2F5; --workspace: #f4f5f7; --canvas: #f6f8fa;
    --ok: #16a34a; --bad: #b91c1c; --warn: #b45309;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: var(--page-bg); display: flex; }
  button { font: inherit; color: inherit; }

  /* ---------- mockup navigator ---------- */
  .nav { width: 300px; flex-shrink: 0; height: 100vh; overflow-y: auto; background: #fff; border-right: 1px solid var(--line); padding: 18px 12px 32px; }
  .nav h1 { font-size: 15px; margin: 0 6px 4px; }
  .nav .sub { font-size: 12px; color: var(--muted); margin: 0 6px 12px; line-height: 1.45; }
  .nav .group { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 14px 6px 4px; }
  .nav button.screen { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 7px; font-size: 13px; cursor: pointer; }
  .nav button.screen:hover { background: rgba(15,23,42,.05); }
  .nav button.screen.on { background: rgba(15,23,42,.08); font-weight: 600; }
  .nav button.screen .n { color: var(--muted); font-size: 11px; min-width: 24px; font-variant-numeric: tabular-nums; }
  .path { margin: 6px 4px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .path .pt { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .path .pf { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .path .steps { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .path .steps button { border: 1px solid var(--line); background: #f8fafc; border-radius: 6px; font-size: 11px; padding: 2px 6px; cursor: pointer; }
  .path .steps span { color: var(--faint); font-size: 11px; }

  .stage { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; padding: 18px 24px 48px; }
  .frame-cap { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .frame-cap b { color: var(--ink); }
  .frame-box { position: relative; }
  .frame-scale { transform-origin: top left; position: absolute; top: 0; left: 0; }
  .notes { max-width: 980px; margin-top: 18px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 20px 16px; }
  .notes h2 { font-size: 15px; margin: 0 0 6px; }
  .notes li { font-size: 13px; line-height: 1.55; }
  .notes ul { padding-left: 18px; margin: 6px 0 0; }
  .notes code { font-size: 12px; background: #f1f5f9; padding: 1px 4px; border-radius: 4px; }

  /* ---------- device ---------- */
  .device { width: 1360px; height: 840px; background: #fff; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 1px 2px rgba(15,23,42,.08), 0 8px 28px rgba(15,23,42,.12); }
  .urlbar { height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #f1f5f9; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .urlbar .u { flex: 1; max-width: 560px; height: 22px; border-radius: 6px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; padding: 0 10px; color: #334155; }
  .urlbar .u b { color: var(--ink); font-weight: 600; }

  /* header */
  .hdr { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; background: #fff; border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
  .logo { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13.5px; margin-right: 8px; }
  .logo .mk, .card .lg .mk { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .crumb { display: inline-flex; align-items: center; height: 28px; border-radius: 7px; font-size: 13px; color: var(--ink); font-weight: 600; white-space: nowrap; }
  .crumb .ct { padding: 0 6px 0 8px; height: 28px; line-height: 28px; display: inline-flex; align-items: baseline; gap: 6px; border-radius: 7px 0 0 7px; }
  .crumb .cvr { width: 22px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 0 7px 7px 0; cursor: pointer; color: var(--muted); }
  .crumb .cvr:hover { background: rgba(15,23,42,.06); }
  .crumb .lv { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .hdr .spacer { flex: 1; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #cbd5e1; color: #1e293b; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; position: relative; }
  .avatar.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0f172a; }
  .tip { position: absolute; top: 40px; right: 6px; z-index: 40; background: #0f172a; color: #fff; font-size: 12px; border-radius: 7px; padding: 6px 10px; white-space: nowrap; line-height: 1.4; }
  .tip span { color: #94a3b8; }
  .ico { width: 16px; height: 16px; flex-shrink: 0; }
  .ico.sm { width: 14px; height: 14px; }

  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .sb { width: 255px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid rgba(15,23,42,.08); display: flex; flex-direction: column; }
  .sb-top { padding: 12px 14px 8px; }
  .sb-top .k { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sb-top .t { font-size: 14px; font-weight: 600; margin-top: 3px; }
  .sb-top .d { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .sb-empty { margin: 18px 16px; font-size: 12px; color: var(--faint); line-height: 1.5; border: 1.5px dashed rgba(15,23,42,.14); border-radius: 8px; padding: 14px 12px; text-align: center; }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .dots { flex: 1; background-color: var(--canvas); background-image: radial-gradient(rgba(15,23,42,.13) 1px, transparent 1px); background-size: 18px 18px; }

  /* ---------- auth cards ---------- */
  .auth { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--canvas); position: relative; }
  .card { width: 420px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px 30px 24px; box-shadow: 0 8px 30px rgba(15,23,42,.08); }
  .card.wide { width: 480px; }
  .card .lg { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; margin-bottom: 18px; }
  .card .lg .mk { width: 28px; height: 28px; border-radius: 8px; font-size: 14px; }
  .card h2 { font-size: 19px; margin: 0 0 4px; }
  .card .sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
  .card .sub b { color: var(--ink); }
  .lab { font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .lab .opt { font-weight: 400; color: var(--muted); }
  .inp { height: 38px; border: 1px solid rgba(15,23,42,.2); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-size: 13.5px; color: var(--ink2); margin-bottom: 12px; background: #fff; }
  .inp.focus { border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,.08); }
  .inp.ok { border-color: #86efac; }
  .inp.bad { border-color: #fca5a5; box-shadow: 0 0 0 3px rgba(239,68,68,.08); }
  .inp .pre { color: var(--faint); }
  .inp .st { margin-left: auto; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .inp .st.ok { color: var(--ok); } .inp .st.bad { color: var(--bad); }
  .hintl { font-size: 11.5px; color: var(--muted); margin: -6px 0 12px; line-height: 1.45; }
  .hintl.bad { color: var(--bad); }
  .btn { height: 38px; border-radius: 8px; border: 0; background: var(--ink); color: #fff; font-weight: 600; font-size: 13.5px; width: 100%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.dis { background: #cbd5e1; cursor: not-allowed; }
  .btn.ghostb { background: #fff; color: var(--ink); border: 1px solid rgba(15,23,42,.18); font-weight: 500; }
  .btn.ghostb:hover { border-color: rgba(15,23,42,.4); }
  .provs { display: flex; flex-direction: column; gap: 8px; }
  .icons { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .icons button { height: 44px; border-radius: 9px; border: 1px solid rgba(15,23,42,.16); background: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .icons button:hover { border-color: rgba(15,23,42,.4); background: #f8fafc; }
  .icons button .pv { width: 24px; height: 24px; border-radius: 6px; font-size: 13px; }
  .icons button:hover::after { content: attr(data-name); position: absolute; top: 50px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; font-size: 11.5px; border-radius: 6px; padding: 3px 8px; white-space: nowrap; z-index: 5; }
  .pv { width: 20px; height: 20px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .pv.ya { background: #fc3f1d; } .pv.mr { background: #005ff9; } .pv.go { background: #fff; color: #4285f4; border: 1px solid rgba(15,23,42,.15); }
  .pv.gh { background: #0f172a; } .pv.fb { background: #1877f2; } .pv.em { background: #e2e8f0; color: #334155; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; margin: 16px 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .fine { font-size: 11.5px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
  .fine a, .lnk { color: var(--ink); text-decoration: underline; cursor: pointer; }
  .back { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); cursor: pointer; margin-bottom: 14px; }
  .back:hover { color: var(--ink); }
  .alert { font-size: 12.5px; line-height: 1.5; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; display: flex; gap: 9px; }
  .alert .ico { margin-top: 1px; }
  .alert.bad { background: #fef2f2; border: 1px solid #fecaca; color: #7f1d1d; }
  .alert.warn { background: #fffbeb; border: 1px solid #fde68a; color: #78350f; }
  .alert.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; }
  .alert.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #14532d; }

  .otp { display: flex; gap: 8px; margin: 4px 0 14px; }
  .otp span { width: 50px; height: 56px; border: 1px solid rgba(15,23,42,.2); border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; background: #fff; }
  .otp span.cur { border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,.08); }
  .otp span.cur::after { content: ""; width: 2px; height: 24px; background: #0f172a; animation: blink 1s steps(1) infinite; }
  .otp.bad span { border-color: #fca5a5; color: var(--bad); }
  .otp.dead span { background: #f8fafc; color: var(--faint); border-color: rgba(15,23,42,.1); }
  .otp .gap { width: 6px; border: 0; background: none; }
  @keyframes blink { 50% { opacity: 0; } }
  .resend { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 14px; }

  /* ---------- organization chooser ---------- */
  .pick { flex: 1; overflow: auto; background: var(--canvas); padding: 40px 0; display: flex; justify-content: center; }
  .pick .inner { width: 560px; }
  .pick h2 { font-size: 22px; margin: 0 0 4px; }
  .pick .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .orow { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .orow:hover { border-color: rgba(15,23,42,.3); box-shadow: 0 6px 20px rgba(15,23,42,.06); }
  .orow .oa { width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0; }
  .orow .on { flex: 1; }
  .orow .on b { font-size: 14px; }
  .orow .on div { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 10.5px; font-weight: 600; border-radius: 5px; padding: 1px 7px; background: #f1f5f9; color: #475569; white-space: nowrap; }
  .badge.adm { background: #ede9fe; color: #5b21b6; }
  .orow.add { border-style: dashed; color: var(--muted); font-size: 13px; }
  .orow.add .oa { background: #f1f5f9; color: var(--muted); }

  /* ---------- menus and dialogs ---------- */
  .menu { position: absolute; z-index: 50; top: 40px; right: 8px; width: 290px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(15,23,42,.16); padding: 6px 0; }
  .menu .who { padding: 8px 14px 10px; border-bottom: 1px solid var(--line2); }
  .menu .who b { font-size: 13.5px; } .menu .who div { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .menu .mg { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 14px 4px; }
  .menu .mi { display: flex; align-items: center; gap: 9px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .menu .mi:hover { background: #f1f5f9; }
  .menu .mi .ck { margin-left: auto; color: var(--ok); }
  .menu .mi .oa { width: 20px; height: 20px; border-radius: 5px; font-size: 10px; font-weight: 700; color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .menu .mi .code { margin-left: auto; font-size: 11.5px; color: var(--faint); }
  .menu hr { border: 0; border-top: 1px solid var(--line2); margin: 6px 0; }
  .scrim { position: absolute; inset: 0; background: rgba(15,23,42,.18); z-index: 55; }
  .dlg { position: absolute; z-index: 60; top: 90px; left: 50%; transform: translateX(-50%); width: 520px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 50px rgba(15,23,42,.2); padding: 20px 22px 18px; }
  .dlg h3 { margin: 0 0 4px; font-size: 17px; }
  .dlg .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
  .dlg .ft { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .btn2 { height: 32px; border-radius: 7px; border: 1px solid rgba(15,23,42,.18); background: #fff; font-size: 12.5px; padding: 0 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn2.pri { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .btn2.dis { opacity: .45; cursor: not-allowed; }
  .btn2.danger { color: var(--bad); border-color: #fecaca; }
  .srow { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 7px; font-size: 13px; }
  .srow .sn { flex: 1; min-width: 0; }
  .srow .sn div { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .srow .reg { font-size: 10.5px; font-weight: 600; border-radius: 5px; padding: 1px 7px; white-space: nowrap; }
  .reg.ru { background: #fee2e2; color: #991b1b; } .reg.ab { background: #dbeafe; color: #1e40af; } .reg.all { background: #dcfce7; color: #166534; }
  .srow.add { border-style: dashed; cursor: pointer; color: #334155; }
  .srow.add:hover { border-color: rgba(15,23,42,.35); }
  .dsec { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 7px; }

  /* ---------- the letter ---------- */
  .mailc { flex: 1; background: #eef1f5; display: flex; justify-content: center; padding: 26px 0; overflow: auto; }
  .mailw { width: 760px; }
  .mhead { background: #fff; border: 1px solid var(--line); border-radius: 10px 10px 0 0; padding: 14px 18px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .mhead b { color: var(--ink); font-weight: 600; }
  .mhead .subj { font-size: 17px; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
  .mbody { background: #eef2f6; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; padding: 34px 0 28px; display: flex; flex-direction: column; align-items: center; }
  /* The letter itself: 520 px wide, one column, system fonts — what renders the same in Gmail, Yandex Mail and Outlook. */
  .letter { width: 520px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 10px 30px rgba(15,23,42,.08); color: #1e293b; }
  .letter .band { background: #0f172a; padding: 20px 32px; display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; font-size: 16px; letter-spacing: .01em; }
  .letter .band .mk { width: 28px; height: 28px; border-radius: 8px; background: #fff; color: #0f172a; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; }
  .letter .band .tag { margin-left: auto; font-size: 11px; font-weight: 500; color: #94a3b8; letter-spacing: .04em; text-transform: uppercase; }
  .letter .lb { padding: 30px 32px 8px; font-size: 14.5px; line-height: 1.65; }
  .letter .lb h1 { font-size: 22px; line-height: 1.3; margin: 0 0 8px; color: #0f172a; letter-spacing: -.01em; }
  .letter .lb p { margin: 0 0 14px; color: #334155; }
  .letter .cells { display: flex; justify-content: center; gap: 8px; margin: 22px 0 10px; }
  .letter .cells span { width: 52px; height: 64px; border-radius: 10px; background: #f1f5f9; border: 1px solid #e2e8f0; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; color: #0f172a; font-variant-numeric: tabular-nums; }
  .letter .cells i { width: 10px; }
  .letter .valid { text-align: center; font-size: 12.5px; color: #64748b; margin-bottom: 24px; }
  .letter .valid b { color: #0f172a; }
  .letter .safe { margin: 4px 32px 28px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; font-size: 12.5px; line-height: 1.55; color: #475569; display: flex; gap: 10px; }
  .letter .safe .ico { color: #64748b; margin-top: 2px; }
  .letter .safe b { color: #0f172a; }
  .lfoot { width: 520px; text-align: center; font-size: 11.5px; color: #94a3b8; line-height: 1.6; margin-top: 16px; }
  .lfoot a { color: #64748b; text-decoration: underline; }

  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #334155; margin: 6px 0 16px; cursor: pointer; }
  .check .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid rgba(15,23,42,.35); background: #fff; flex-shrink: 0; margin-top: 1px; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
  .check.on .box { background: var(--ink); border-color: var(--ink); }
  .check a { color: var(--ink); text-decoration: underline; }
  .cookie { position: absolute; z-index: 45; left: 50%; bottom: 20px; transform: translateX(-50%); width: 760px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(15,23,42,.18); padding: 14px 16px; display: flex; gap: 14px; align-items: center; font-size: 13px; line-height: 1.5; color: #334155; }
  .cookie .ck { font-size: 22px; }
  .cookie b { color: var(--ink); }
  .cookie a { color: var(--ink); text-decoration: underline; cursor: pointer; }
  .cookie .btn2 { margin-left: auto; }
  .auth.blocked .card { opacity: .55; pointer-events: none; }
  .inp.pw { justify-content: space-between; letter-spacing: .18em; }
  .inp.pw .eye { letter-spacing: 0; color: var(--muted); font-size: 12px; cursor: pointer; }
  .lab a { font-weight: 500; color: var(--ink); text-decoration: underline; cursor: pointer; }
  .switch-line { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 12px; }
  .switch-line a { color: var(--ink); text-decoration: underline; cursor: pointer; font-weight: 500; }
  /* ---------- the phone: 375 × 812, one column, no horizontal scrolling ---------- */
  .device.phone { width: 375px; height: 812px; border-radius: 34px; }
  .device.phone .urlbar { height: 44px; padding: 0 14px; border-radius: 34px 34px 0 0; }
  .device.phone .urlbar .u { max-width: none; font-size: 12px; }
  .device.phone .auth { align-items: flex-start; padding: 14px 0 24px; overflow-y: auto; }

/* ======================= 1 · signing in ======================= */

  const pw = S.pwState;

  if (pw === "wrong") alert = `<div class="alert bad">${I.alert}<div><b>Wrong email or password.</b> Check both, or <a class="lnk" onclick="go({screen:'reset',resetState:'request'})">reset the password</a>.</div></div>`;
  if (pw === "locked") alert = `<div class="alert warn">${I.alert}<div><b>Too many tries for this email.</b> You can try again at <b>14:52</b>, or <a class="lnk" onclick="go({screen:'reset',resetState:'request'})">reset the password</a> now.</div></div>`;
  return `<div class="auth"><div class="card">

    <div class="inp pw${pw === "ok" ? " focus" : " bad"}"><span>••••••••••</span><span class="eye">Show</span></div>
    <button class="btn${pw === "locked" ? " dis" : ""}" onclick="go({screen:'org',pop:null})">Sign in</button>
    <div class="switch-line">No account? <a onclick="go({screen:'signup',signupState:'ok'})">Create one</a></div>
    <div class="or">or continue with</div>
    <div class="icons">${provs}</div>
    ${ru ? `<div class="fine">In Russia Maxitor signs in by email and password, Yandex ID or Mail.ru ID, as Russian law requires.</div>`
      : `<div class="fine">Going to Russia? Google, GitHub and Facebook do not work there. Link your email, Yandex ID or Mail.ru ID in “Sign-in methods” beforehand.</div>`}
    <div class="legal-links"><a onclick="go({screen:'privacy'})">Privacy</a><a onclick="go({screen:'deletion'})">Delete my data</a></div>
  </div></div>`;
}

function viewSignup() {
  const weak = S.signupState === "weak";
  return `<div class="auth"><div class="card">
    <div class="lg"><span class="mk">M</span>Maxitor</div>
    <h2>Create an account</h2>
    <div class="sub">Your email is your login. We send a code to confirm it is yours.</div>

    <div class="legal-links"><a onclick="go({screen:'privacy'})">Privacy</a><a onclick="go({screen:'deletion'})">Delete my data</a></div>
  </div></div>`;
}

function viewCode() {
  const st = S.codeState;
  const em = ME().email;
  const digits = st === "typing" ? ["4", "8", "2", "", "", ""] : ["4", "8", "2", "9", "1", "7"];
  const boxes = digits.map((d, i) => `${i === 3 ? '<span class="gap"></span>' : ""}<span class="${st === "typing" && i === 3 ? "cur" : ""}">${d}</span>`).join("");
  let alert = "", btn = `<button class="btn${st === "typing" ? " dis" : ""}" onclick="go({screen:'consent',consent:false})">Confirm</button>`, otpCls = "", resend = `<span>No letter? Check spam.</span><span>Send again in <b>0:42</b></span>`;
  if (st === "wrong") { otpCls = " bad"; alert = `<div class="alert bad">${I.alert}<div><b>The code is wrong.</b> 3 tries are left for this code.</div></div>`; btn = `<button class="btn">Try again</button>`; }
  if (st === "used") { otpCls = " dead"; alert = `<div class="alert bad">${I.alert}<div><b>This code no longer works:</b> it was wrong five times. Ask for a new one — the old one is gone.</div></div>`; btn = `<button class="btn" onclick="go({codeState:'typing'})">${I.mail}Send a new code</button>`; resend = ""; }
  if (st === "expired") { otpCls = " dead"; alert = `<div class="alert warn">${I.alert}<div><b>The code has expired.</b> A code lives ten minutes. Ask for a new one.</div></div>`; btn = `<button class="btn" onclick="go({codeState:'typing'})">${I.mail}Send a new code</button>`; resend = ""; }
  if (st === "limit") { otpCls = " dead"; alert = `<div class="alert warn">${I.alert}<div><b>Too many codes for this address.</b> One address gets ten codes an hour. A new one can be sent at <b>14:52</b>.</div></div>`; btn = `<button class="btn dis">Send a new code at 14:52</button>`; resend = ""; }

}

function viewRefused() {

/* ======================= 5 · sign-in methods ======================= */
function dlgMethods() {
  const ru = S.region === "russia";
  const p = ME();
  const mine = ru
    ? [["ya", "Я", "Yandex ID", "anna.kovaleva@yandex.ru · added 9 Nov from Russia", "ru", "in Russia"]]
    : [["go", "G", "Google", "daniel.weber@gmail.com · added 9 Nov from Germany", "ab", "outside Russia"]];
  mine[0][4] = ru ? "all" : "ab"; mine[0][5] = ru ? "everywhere" : "outside Russia";
  if (S.linkState === "done") mine.push(["em", "✉", "Email and password", `${ru ? "anna@severny-veter.ru" : "d.weber@lumen.de"} · added just now`, "all", "everywhere"]);
  const rows = mine.map(([k, t, n, d, r, rt]) => `<div class="srow">${pvMark(k, t)}<div class="sn"><b>${n}</b><div>${esc(d)}</div></div>${mine.length > 1 ? `<button class="btn2 danger">Unlink</button>` : `<button class="btn2 dis" title="The last way in cannot be unlinked">Unlink</button>`}</div>`).join("");
  const offer = [];
  if (S.linkState !== "done") offer.push(["em", "✉", "Email and password", "works in every country", "all", "everywhere", "go({linkState:'email'})"]);
  const RUS = ["Yandex ID", "Mail.ru ID"];
  PROVIDERS[S.region].forEach(([k, t, n]) => { if (!mine.some(m => m[2] === n)) offer.push([k, t, n, "", RUS.includes(n) ? "all" : "ab", RUS.includes(n) ? "everywhere" : "outside Russia", ""]); });
  const add = offer.map(([k, t, n, d, r, rt, on]) => `<div class="srow add" onclick="${on}">${pvMark(k, t)}<div class="sn"><b>Link ${n}</b>${d ? `<div>${d}</div>` : ""}</div></div>`).join("");
  let body = `<div class="dsec">How you sign in</div>${rows}<div class="dsec">Add a way in</div>${add}

/* ======================= render ======================= */
function render() {
  const app = document.getElementById("app");
  let html = "";
  const sc = S.screen;
  if (sc === "signin") html = urlbar(S.next ? `/sign-in?next=${S.next}` : "/") + viewSignin();
  else if (sc === "code") html = urlbar("/sign-up/confirm") + viewCode();
  else if (sc === "signup") html = urlbar("/sign-up") + viewSignup();
  else if (sc === "reset") html = urlbar("/reset-password") + viewReset();
  else if (sc === "refused") html = urlbar("/sign-in/google/callback") + viewRefused();
  else if (sc === "neworg") html = urlbar("/new") + viewNewOrg();
  else if (sc === "choose") html = urlbar("/w") + viewChoose();
  else if (sc === "org") html = urlbar("/w/severny-veter") + header() + viewOrg();
  else if (sc === "letter") html = viewLetter();
  else if (sc === "nf") html = urlbar("/w/orbita") + header() + viewNotFound();
  else if (sc === "consent") html = urlbar("/sign-in/new-account") + viewConsent();
  else if (sc === "privacy") html = urlbar("/privacy") + viewPrivacy();
  else if (sc === "deletion") html = urlbar("/data-deletion") + viewDeletion();
  if (!S.cookies && ["signin", "signup", "code", "reset", "refused", "consent", "privacy", "deletion"].includes(sc)) { html = html.replace('<div class="auth">', '<div class="auth blocked">') + cookieBanner(); }
  if (S.pop === "me") html += menuMe();
  else if (S.pop === "orgs") html += menuOrgs();
  else if (S.pop === "methods") html += dlgMethods();
  app.classList.toggle("phone", !!S.phone);
  app.innerHTML = html;
  renderNav(); renderNotes(); fit();
}

function stateOf(n) { for (const [, items] of SCREENS) for (const [k, , st] of items) if (k === n) return st; return null; }
function curNum() {
  for (const [, items] of SCREENS) for (const [n, , st] of items) {
    const full = Object.assign({}, DEF, st);
    if (Object.entries(full).every(([k, v]) => S[k] === v)) return n;
  }
  return null;
}
function openNum(n) { go(Object.assign({}, DEF, stateOf(n))); }
function renderNav() {
  const cur = curNum();
  let h = `<h1>Maxitor core: the first people</h1><div class="sub">The exact screens of issue #73: signing in, registering an organization, the empty frame and sign-in methods. Every screen is live: buttons lead where the real ones will.</div>`;
  for (const [g, items] of SCREENS) {
    h += `<div class="group">${g}</div>`;
    for (const [n, t] of items) h += `<button class="screen${cur === n ? " on" : ""}" onclick="openNum('${n}')"><span class="n">${n}</span>${t}</button>`;
  }
  h += `<div class="group">Paths</div>`;
  for (const [t, f, steps] of PATHS) h += `<div class="path"><div class="pt">${t}</div><div class="pf">${f}</div><div class="steps">${steps.map(([s, n], i) => `${i ? "<span>→</span>" : ""}<button onclick="openNum('${n}')">${s}</button>`).join("")}</div></div>`;
  document.getElementById("nav").innerHTML = h;
}
function renderNotes() {
  const n = curNum();
  const note = NOTES[n];
  document.getElementById("cap").innerHTML = note ? `<b>${n} · ${note[0]}</b> — the screen is live` : "Free navigation through the mockup";
  document.getElementById("notes").innerHTML = note ? `<h2>${n} · ${note[0]}</h2><ul>${note[1].map(x => `<li>${x}</li>`).join("")}</ul>` : `<h2>Free navigation</h2><ul><li>You got here by moving through the screens themselves.</li></ul>`;
}
function fit() {
  const stage = document.getElementById("stage"), sc = document.getElementById("scale"), box = document.getElementById("box");
  const w = S.phone ? 375 : 1360, h = S.phone ? 812 : 840;
  const k = Math.min(1, (stage.clientWidth - 48) / w);
  sc.style.transform = `scale(${k})`; box.style.height = h * k + "px";
}
window.addEventListener("resize", fit);
document.addEventListener("keydown", e => { if (e.key === "Escape") go({ pop: null, linkState: null }); });
render();
</script>
