  .stage { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; padding: 18px 24px 48px; }

/* [project]/components/frame/frame.css [app-client] (css) */
.mx-frame {
  height: 100vh;
  font-family: var(--mx-font);
  color: var(--mx-ink);
  flex-direction: column;
  display: flex;
}

.mx-body {
  flex: 1;
  min-height: 0;
  display: flex;
  position: relative;
}

.mx-top {
  height: var(--mx-top-row);
  align-items: center;
  gap: var(--mx-space-3);
  padding: 0 var(--mx-space-5);
  background: var(--mx-surface);
  border-bottom: var(--mx-line-width) solid var(--mx-line);
  z-index: 20;
  flex-shrink: 0;
  display: flex;
  position: relative;
}

.mx-logo {
  align-items: center;
  gap: var(--mx-space-3);
  font-weight: var(--mx-weight-heavy);
  font-size: var(--mx-text-md);
  margin-right: var(--mx-space-4);
  display: inline-flex;
}

.mx-logo-mark {
  width: var(--mx-control-sm);
  height: var(--mx-control-sm);
  border-radius: var(--mx-radius-sm);
  background: var(--mx-ink);
  color: var(--mx-on-ink);
  font-size: var(--mx-text-sm);
  justify-content: center;
  align-items: center;
  display: inline-flex;
}

.mx-org {
  height: var(--mx-control);
  border-radius: var(--mx-radius-sm);
  font-size: var(--mx-text-md);
  font-weight: var(--mx-weight-bold);
  white-space: nowrap;
  align-items: center;
  display: inline-flex;
}

.mx-org-name {
  padding: 0 var(--mx-space-3) 0 var(--mx-space-4);
  color: inherit;
  text-decoration: none;
}

.mx-org-kind {
  font-size: var(--mx-text-tiny);
  color: var(--mx-faint);
  text-transform: uppercase;
  letter-spacing: var(--mx-tracking-caps);
  margin-right: var(--mx-space-3);
}

.mx-org-switch {
  width: var(--mx-control-sm);
  height: var(--mx-control);
  border-radius: var(--mx-radius-sm);
  color: var(--mx-muted);
  cursor: pointer;
  background: none;
  border: 0;
  justify-content: center;
  align-items: center;
  display: inline-flex;
}

.mx-org-switch:hover, .mx-burger:hover {
  background: var(--mx-hover);
}

.mx-path {
  align-items: center;
  gap: var(--mx-space-2);
  min-width: 0;
  font-size: var(--mx-text-md);
  color: var(--mx-muted);
  flex: 1;
  display: flex;
  overflow: hidden;
}

.mx-path-step {
  white-space: nowrap;
  text-overflow: ellipsis;
  min-width: 0;
  overflow: hidden;
}

.mx-path-step:first-child, .mx-path-step:last-child {
  flex-shrink: 0;

.mx-path-step:last-child {

  font-weight: var(--mx-weight-medium);

.mx-path-sep {
  color: var(--mx-faint);
  flex-shrink: 0;
}

.mx-slot {
  align-items: center;
  min-width: 0;
  display: inline-flex;
}

.mx-avatar {
  width: var(--mx-control);
  height: var(--mx-control);
  border-radius: var(--mx-radius-round);
  background: var(--mx-faint);
  color: var(--mx-on-ink);
  font-size: var(--mx-text-sm);
  font-weight: var(--mx-weight-heavy);
  cursor: pointer;
  border: 0;
  justify-content: center;
  align-items: center;
  display: inline-flex;

.mx-avatar.on {
  box-shadow: 0 0 0 var(--mx-ring) var(--mx-surface), 0 0 0 calc(2 * var(--mx-ring)) var(--mx-ink);
}

.mx-burger {
  width: var(--mx-tree-slot);
  height: var(--mx-tree-slot);

  background: none;
  border: 0;
  justify-content: center;
  align-items: center;
  display: none;

.mx-menu {

.mx-filter-row { display: flex; align-items: center; gap: var(--mx-space-4); width: 100%; min-width: 0; border: 0; background: none; padding: 0; font-size: var(--mx-text-sm); color: var(--mx-ink); cursor: pointer; text-align: left; transition: opacity 120ms ease; }
.mx-filter-row.off, .mx-filter-row.absent { opacity: 0.42; }
.mx-filter-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mx-filter-note { font-size: var(--mx-text-sm); color: var(--mx-faint); padding-bottom: var(--mx-space-4); }
.mx-disk { box-sizing: border-box; width: var(--mx-badge); height: var(--mx-badge); border-radius: var(--mx-radius-round); flex-shrink: 0; border: var(--mx-line-width) solid var(--mx-line); display: inline-flex; align-items: center; justify-content: center; color: var(--mx-on-ink); font-size: var(--mx-text-badge); font-weight: var(--mx-weight-heavy); }
.mx-filter-row.field { cursor: text; }
button.mx-filter-row.field { cursor: pointer; }
.mx-disk.mark { background: var(--mx-surface); color: var(--mx-muted); }
.mx-filter-row.field.on .mx-disk.mark, .mx-filter-row.field.open .mx-disk.mark { color: var(--mx-ink); border-color: var(--mx-muted); }
.mx-filter-input { flex: 1; min-width: 0; height: var(--mx-badge); border: 0; border-bottom: var(--mx-line-width) solid transparent; padding: 0; font: inherit; font-size: var(--mx-text-sm); color: var(--mx-ink); background: transparent; outline: none; }
.mx-filter-input::placeholder { color: var(--mx-faint); }
.mx-filter-input:focus { border-bottom-color: var(--mx-faint); }
.mx-filter-input.number { text-align: right; font-variant-numeric: tabular-nums; }
.mx-filter-pre { color: var(--mx-muted); }
.mx-filter-how { display: block; font-size: var(--mx-text-tiny); color: var(--mx-cal-link); overflow: hidden; text-overflow: ellipsis; }
.mx-filter-clear { flex-shrink: 0; width: var(--mx-icon); height: var(--mx-icon); border-radius: var(--mx-radius-sm); color: var(--mx-muted); display: inline-flex; align-items: center; justify-content: center; font-size: var(--mx-text-md); line-height: 1; }
.mx-filter-clear:hover { background: var(--mx-hover); color: var(--mx-ink); }
.mx-filter-more { align-self: flex-start; border: 0; background: none; padding: 0 0 0 calc(var(--mx-badge) + var(--mx-space-4)); font-size: var(--mx-text-sm); color: var(--mx-cal-link); cursor: pointer; }
.mx-filters-sheet-head, .mx-filters-scrim { display: none; }
.mx-paint { display: flex; justify-content: center; gap: var(--mx-space-3); padding: var(--mx-space-3) 0; border-top: var(--mx-line-width) solid var(--mx-line-2); margin: 0 calc(var(--mx-filter-pad) * -1); }
.mx-paint button { width: var(--mx-icon-sm); height: var(--mx-icon-sm); border-radius: var(--mx-radius-round); border: var(--mx-line-width) solid var(--mx-line-3); background: var(--mx-surface); padding: 0; cursor: pointer; }
.mx-paint button.on { background: var(--mx-ink); border-color: var(--mx-ink); }

/* the bottom bar: bottom left and flat, as maxitor-web's ZoomToolbar — zoom in, out, fit and the percentage, then
   the page's sections behind hairlines */
.mx-bar { left: var(--mx-space-5); bottom: var(--mx-space-5); padding: var(--mx-space-1) 0; background: none; border: 0; box-shadow: none; backdrop-filter: none; }
.mx-bar button { width: var(--mx-bar-button); height: var(--mx-bar-button); border: 0; border-radius: var(--mx-radius-md); background: transparent; color: var(--mx-muted); font-size: var(--mx-text-lg); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.mx-bar button:hover:not(:disabled) { background: var(--mx-hover); color: var(--mx-ink); }
.mx-bar button.on, .mx-bar button.on:hover { color: var(--mx-palette-blue); background: transparent; }
.mx-bar button:disabled { opacity: 0.4; cursor: default; }
.mx-bar-value { min-width: var(--mx-bar-button); text-align: center; font-size: var(--mx-text-sm); color: var(--mx-muted); font-variant-numeric: tabular-nums; padding: 0 var(--mx-space-3) 0 var(--mx-space-2); user-select: none; }
.mx-bar-sections, .mx-bar-group, .mx-bar-more { display: inline-flex; align-items: center; gap: var(--mx-space-1); }
.mx-bar-hairline { width: var(--mx-line-width); height: var(--mx-bar-hairline); background: var(--mx-line); margin: 0 var(--mx-space-1); }
.mx-bar-more { display: none; position: relative; }
.mx-bar-menu { position: absolute; bottom: calc(100% + var(--mx-space-3)); right: 0; z-index: var(--mx-layer-shell-pop); display: inline-flex; align-items: center; gap: var(--mx-space-1); padding: var(--mx-space-1); background: var(--mx-surface); border: var(--mx-line-width) solid var(--mx-line); border-radius: var(--mx-radius-md); box-shadow: var(--mx-shadow-pop); }

/* the page's actions: top right */
.mx-actions { top: var(--mx-space-5); right: var(--mx-space-5); display: flex; gap: var(--mx-space-3); }
.mx-action { height: var(--mx-control); padding: 0 var(--mx-space-5); border: 0; border-radius: var(--mx-radius-md); background: var(--mx-ink); color: var(--mx-on-ink); font-size: var(--mx-text-md); cursor: pointer; display: inline-flex; align-items: center; gap: var(--mx-space-3); box-shadow: var(--mx-shadow-float); }

@media (max-width: 520px) {
  .mx-pill-label { display: none; }
  .mx-filters { width: auto; max-height: none; overflow: visible; padding: 0; background: none; border: 0; box-shadow: none; backdrop-filter: none; }
  .mx-filters:not(.folded) .mx-filters-body { box-sizing: border-box; }
  .mx-filters-button { display: inline-flex; align-items: center; gap: var(--mx-space-3); height: var(--mx-control); padding: 0 var(--mx-space-5); border: var(--mx-line-width) solid var(--mx-line); border-radius: var(--mx-radius-round); background: var(--mx-surface); font-size: var(--mx-text-md); cursor: pointer; }
  .mx-filters.folded .mx-filters-body { display: none; }
  /* open on a phone: the same sections in a sheet from below, Done closing it */
  .mx-filters:not(.folded) .mx-filters-body { position: fixed; left: 0; right: 0; bottom: 0; max-height: 80%; overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box; background: var(--mx-surface); border-radius: var(--mx-sheet-radius) var(--mx-sheet-radius) 0 0; box-shadow: var(--mx-shadow-pop); padding: 0 var(--mx-space-6) var(--mx-space-7); z-index: var(--mx-layer-shell-pop); }
  .mx-filters:not(.folded) .mx-filters-sheet-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; padding: var(--mx-space-5) 0 var(--mx-space-3); background: var(--mx-surface); font-size: var(--mx-text-lg); }
  .mx-filters-sheet-head button { border: 0; background: var(--mx-ink); color: var(--mx-on-ink); border-radius: var(--mx-radius-md); height: var(--mx-bar-button); padding: 0 var(--mx-space-6); font-size: var(--mx-text-md); font-weight: var(--mx-weight-bold); cursor: pointer; }
  .mx-filters:not(.folded) { z-index: var(--mx-layer-shell-pop); }
  .mx-filters-scrim { display: block; position: fixed; inset: 0; background: var(--mx-scrim); }
  .mx-filters:not(.folded) .mx-filter-row, .mx-filters:not(.folded) .mx-filter-input { font-size: var(--mx-text-md); }
  .mx-bar.folds > .mx-bar-sections { display: none; }
  .mx-bar.folds > .mx-bar-more { display: inline-flex; }
  .mx-bar button { width: var(--mx-tree-row-phone); height: var(--mx-tree-row-phone); }
  .mx-empty-state { margin: var(--mx-space-5); }
  /* above the bottom bar, which takes the whole bottom row of a phone */
  .mx-actions { top: auto; bottom: calc(var(--mx-space-5) + var(--mx-tree-row-phone) + var(--mx-space-3)); }
  .mx-shell-content.document.with-filters { padding-left: var(--mx-space-5); }
}

/* the empty state: a dashed card in the content field, as the mockup's "No notes yet" */
.mx-empty-state { box-sizing: border-box; max-width: var(--mx-empty-width); margin: var(--mx-space-7) auto; background: var(--mx-surface); border: var(--mx-dashed-width) dashed var(--mx-line-3); border-radius: var(--mx-radius-lg); padding: var(--mx-empty-pad-y) var(--mx-empty-pad-x); text-align: center; color: var(--mx-muted); font-size: var(--mx-text-md); line-height: 1.55; }
.mx-empty-state b { display: block; color: var(--mx-ink-2); font-size: var(--mx-text-lg); margin-bottom: var(--mx-space-2); }

/* @maxitor/panel — the canvas: a field of dots that moves and scales with the picture; its zoom is in the shell's bar. */
.mx-canvas { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; outline: none; background-image: radial-gradient(var(--mx-dot) var(--mx-dot-size), transparent var(--mx-dot-size)); }
.mx-canvas:active { cursor: grabbing; }
.mx-canvas:focus-visible { box-shadow: inset 0 0 0 var(--mx-ring) var(--mx-line-3); }
.mx-canvas-scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* web/app/notes.css — the template's own look inside the content field, drawn with Maxitor's tokens: the cards' grid
   on the canvas, a card's tools, its editing and its words, a dialog's fields. Nothing is placed fixed and no layer
   reaches the shell's: dialogs are the shell's own. */
.nt-grid { position: absolute; left: 0; top: 0; grid-template-columns: repeat(3, 280px); gap: 16px; }
.nt-card { min-height: 120px; display: flex; flex-direction: column; gap: var(--mx-space-3); }
.nt-card.fresh { box-shadow: 0 0 0 var(--mx-ring) var(--mx-palette-blue), var(--mx-shadow-float); }
.nt-new { font-size: var(--mx-text-xs); font-weight: var(--mx-weight-bold); color: var(--mx-palette-blue); }
.nt-tools { margin-left: auto; display: inline-flex; gap: var(--mx-space-2); }
.nt-tools button, .nt-row button, .nt-ask button { border: 0; background: transparent; color: var(--mx-muted); font: inherit; font-size: var(--mx-text-sm); cursor: pointer; border-radius: var(--mx-radius-sm); padding: var(--mx-space-1) var(--mx-space-3); }
.nt-tools button:hover, .nt-row button:hover, .nt-ask button:hover { background: var(--mx-hover); color: var(--mx-ink); }
.nt-more { display: none; }
.nt-body { white-space: pre-wrap; }
.nt-edit, .mx-dialog textarea { display: flex; flex-direction: column; gap: var(--mx-space-3); }
.nt-edit textarea, .mx-dialog textarea, .mx-dialog input { width: 100%; box-sizing: border-box; font: inherit; font-size: var(--mx-text-md); color: var(--mx-ink); border: var(--mx-line-width) solid var(--mx-line-3); border-radius: var(--mx-radius-md); padding: var(--mx-space-4) var(--mx-space-5); resize: vertical; }
.mx-dialog label { display: flex; flex-direction: column; gap: var(--mx-space-2); font-size: var(--mx-text-sm); color: var(--mx-muted); }
.nt-row { display: flex; justify-content: flex-end; gap: var(--mx-space-3); }
.nt-row .nt-primary { background: var(--mx-ink); color: var(--mx-on-ink); padding: var(--mx-space-3) var(--mx-space-5); }
.nt-row .nt-primary:hover { background: var(--mx-ink-2); color: var(--mx-on-ink); }
.nt-row button:disabled { opacity: 0.4; cursor: default; }
.nt-ask { display: flex; align-items: center; gap: var(--mx-space-3); flex-wrap: wrap; font-size: var(--mx-text-sm); color: var(--mx-ink-3); }
.nt-danger { color: var(--mx-bad) !important; }
.nt-said { font-size: var(--mx-text-sm); color: var(--mx-warn); line-height: 1.45; }
.nt-sheet-button { border: 0; background: var(--mx-hover); border-radius: var(--mx-radius-md); padding: var(--mx-space-5); font: inherit; font-size: var(--mx-text-md); text-align: left; cursor: pointer; }
.nt-revision { position: absolute; left: 0; top: 0; width: 872px; box-sizing: border-box; }
.nt-revision b { font-size: var(--mx-text-lg); color: var(--mx-ink); }
.nt-below { position: absolute; left: 0; }
.nt-kind { font-size: var(--mx-text-xs); font-weight: var(--mx-weight-bold); text-transform: uppercase; letter-spacing: var(--mx-tracking-caps); }
.nt-kind.added { color: var(--mx-ok); }
.nt-kind.changed { color: var(--mx-warn); }
.nt-kind.removed { color: var(--mx-bad); }
.nt-before { color: var(--mx-muted); text-decoration: line-through; white-space: pre-wrap; }
@media (max-width: 520px) {
  .nt-tools button:not(.nt-more) { display: none; }
  .nt-more { display: inline-flex; }
}


/* Issue #121 — what the template adds to its notes.css for the draft and the conflicts, drawn with Maxitor's tokens
   only, as the rest of notes.css. Everything else on these screens is the production CSS of the core and of
   @maxitor/panel, unchanged. */
.nt-page { position: absolute; left: 0; top: 0; width: 872px; display: flex; flex-direction: column; gap: 16px; }
.nt-page .nt-grid { position: static; }
.nt-page .nt-revision { position: static; width: auto; }
.nt-head { display: flex; align-items: center; gap: var(--mx-space-4); flex-wrap: wrap; min-height: var(--mx-control); }
.nt-head span { color: var(--mx-muted); font-size: var(--mx-text-sm); }
.nt-head .nt-counts { margin-left: auto; display: inline-flex; align-items: center; gap: var(--mx-space-6); }
.nt-count { display: inline-flex; align-items: center; gap: var(--mx-space-3); font-size: var(--mx-text-sm); color: var(--mx-ink-3); }
.nt-count .nt-disk { width: 16px; height: 16px; }
.nt-head button { margin-left: auto; border: var(--mx-line-width) solid var(--mx-line-3); background: var(--mx-surface); border-radius: var(--mx-radius-md); padding: var(--mx-space-2) var(--mx-space-4); font: inherit; font-size: var(--mx-text-sm); color: var(--mx-ink); cursor: pointer; }
/* The filter's disk is maxitor-web's: @maxitor/panel draws this image in place of its coloured mx-disk. */
.nt-disk { border-radius: 50%; border: 1px solid rgba(0,0,0,0.12); flex-shrink: 0; box-sizing: content-box; }
.nt-card.k-a { border-left: 3px solid var(--mx-ok); }
.nt-card.k-c { border-left: 3px solid var(--mx-palette-amber); }
.nt-card.k-r { border-left: 3px solid var(--mx-palette-red); background: #fffafa; }
.nt-del { background: #fee2e2; color: #991b1b; text-decoration: line-through; border-radius: 3px; padding: 0 1px; }
.nt-ins { background: #dcfce7; color: #166534; border-radius: 3px; padding: 0 1px; }
.nt-gone { color: var(--mx-faint); text-decoration: line-through; }
.nt-ico { width: 14px; height: 14px; flex-shrink: 0; }
.nt-race { display: flex; gap: 9px; align-items: flex-start; background: #fff7ed; border: 1px solid #fed7aa; color: #7c2d12; border-radius: var(--mx-radius-md); padding: 10px 14px; font-size: var(--mx-text-sm); line-height: 1.5; }
.nt-race .nt-ico { margin-top: 2px; }
.nt-race a { text-decoration: underline; cursor: pointer; font-weight: var(--mx-weight-bold); }
.nt-meet { display: flex; gap: 6px; align-items: center; font-size: var(--mx-text-sm); color: #9a3412; }
.nt-ref { font-size: var(--mx-text-md); font-weight: var(--mx-weight-bold); background: #ede9fe; color: #5b21b6; border-radius: 7px; padding: 3px 9px; }
.nt-ref.dr { background: #e0f2fe; color: #075985; }
.nt-mark { display: inline-flex; gap: 6px; align-items: center; border-radius: 6px; padding: 2px 8px; background: #e0f2fe; color: #075985; }
.nt-mark.removed { background: #fee2e2; color: #991b1b; }
.mx-action:disabled { opacity: 0.4; cursor: default; }
.nt-toast { position: fixed; z-index: 70; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--mx-ink); color: #fff; font-size: var(--mx-text-md); border-radius: 9px; padding: 10px 14px; display: flex; gap: 9px; align-items: center; box-shadow: 0 10px 30px rgba(15,23,42,.25); white-space: nowrap; }
.nt-toast .nt-ico { color: #86efac; }
.nt-toast a { color: #cbd5e1; text-decoration: underline; cursor: pointer; margin-left: 6px; }
@media (max-width: 520px) { .nt-toast { left: 12px; right: 12px; transform: none; white-space: normal; bottom: 120px; } }
.nt-tools { flex-shrink: 0; }
.mx-actions { align-items: center; }
.mx-actions .cstep-o { position: static; }
.mx-actions .cstep-o .pill { height: var(--mx-control); }
.nt-tools button { white-space: nowrap; }
.nt-card > .nt-kind { margin-top: calc(var(--mx-space-2) * -1); }
.nt-card.meets { border-color: #fdba74; }
.nt-foot { font-size: var(--mx-text-sm); color: var(--mx-muted); }
.nt-mark { align-self: flex-start; font-size: var(--mx-text-xs); font-weight: var(--mx-weight-bold); color: var(--mx-palette-blue); cursor: pointer; }
.nt-mark.removed { color: var(--mx-bad); }
.nt-sec { font-size: var(--mx-text-xs); font-weight: var(--mx-weight-bold); text-transform: uppercase; letter-spacing: var(--mx-tracking-caps); color: var(--mx-muted); }
.nt-list { display: flex; flex-direction: column; gap: var(--mx-space-2); font-size: var(--mx-text-sm); }
.nt-list div { display: flex; gap: var(--mx-space-4); align-items: baseline; min-width: 0; }
.nt-list div > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--mx-ink-3); }
.nt-conflict { border: var(--mx-line-width) solid var(--mx-line); border-radius: var(--mx-radius-md); padding: var(--mx-space-5); display: flex; flex-direction: column; gap: var(--mx-space-3); }
.nt-conflict.over { border-color: var(--mx-palette-blue); }
.nt-conflict .mx-card-head { margin: 0; flex-wrap: wrap; }
.nt-side { border-radius: var(--mx-radius-sm); padding: var(--mx-space-3) var(--mx-space-4); background: var(--mx-hover); font-size: var(--mx-text-sm); line-height: 1.5; }
.nt-side.mine { background: var(--mx-selected); }
.nt-conflict.give .nt-side.mine { opacity: 0.5; }
.nt-side i { display: block; font-style: normal; font-size: var(--mx-text-xs); font-weight: var(--mx-weight-bold); text-transform: uppercase; letter-spacing: var(--mx-tracking-caps); color: var(--mx-muted); margin-bottom: var(--mx-space-1); }
.nt-choice { display: flex; gap: var(--mx-space-3); flex-wrap: wrap; align-items: center; }
.nt-choice button { border: var(--mx-line-width) solid var(--mx-line-3); background: var(--mx-surface); border-radius: var(--mx-radius-md); padding: var(--mx-space-3) var(--mx-space-5); font: inherit; font-size: var(--mx-text-sm); color: var(--mx-ink); cursor: pointer; }
.nt-choice button.on { background: var(--mx-ink); border-color: var(--mx-ink); color: var(--mx-on-ink); }
.nt-choice span { font-size: var(--mx-text-sm); color: var(--mx-muted); }
.nt-row .nt-left { margin-right: auto; align-self: center; font-size: var(--mx-text-sm); color: var(--mx-muted); }
@media (max-width: 520px) {
  .nt-choice button { flex: 1; }
}
</script>
<!-- The time scale and the change stepper of the accepted mockup of spec 074. -->
<script type="text/plain" id="hist-css">/* The time scale and the change stepper, as the accepted mockup of spec 074 draws them (maxitor-web's track). */
:root { --page-bg: #e9edf1; --ink: #0f172a; --ink2: #1e293b; --muted: #64748b; --faint: #94a3b8; --line: rgba(15,23,42,.1); --line2: rgba(15,23,42,.06); --ok: #16a34a; --bad: #b91c1c; --warn: #b45309; --add: #16a34a; --rem: #dc2626; --chg: #d97706; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: #cbd5e1; color: #1e293b; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.avatar.sm { width: 24px; height: 24px; font-size: 10px; }
.pill { height: 28px; display: inline-flex; align-items: center; border-radius: 8px; background: rgba(15,23,42,.05); margin-left: 6px; min-width: 0; }
.pill.open { background: rgba(15,23,42,.1); }
.pill .pb2 { height: 28px; border: 0; background: none; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; font-size: 12.5px; color: #334155; cursor: pointer; white-space: nowrap; min-width: 0; border-radius: 8px; }
.pill .pb2 b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.pill .pb2 .live { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(22,163,74,.15); }
.pill .pb2 .past { width: 7px; height: 7px; border-radius: 50%; background: #2563eb; flex-shrink: 0; }
.pill .stp { width: 26px; height: 28px; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #475569; }
.pill .stp.off { color: #cbd5e1; cursor: default; }
.pill .dv { width: 1px; height: 16px; background: rgba(15,23,42,.12); }
.pill .nowb { border: 0; background: none; font-size: 12px; color: #1d4ed8; font-weight: 600; padding: 0 9px; height: 28px; cursor: pointer; white-space: nowrap; }
.ctl .who .avatar { width: 22px; height: 22px; font-size: 9px; border: 2px solid #fff; margin-left: -8px; }
.revhd .tt { flex: 1; min-width: 0; }
.revhd .tt b { font-size: 14px; }
.revhd .tt div { font-size: 12px; color: var(--muted); margin-top: 2px; }
.pill .md { font-weight: 400; color: #475569; }
.pill .cnts { display: inline-flex; gap: 5px; font-weight: 600; margin-left: 4px; flex-shrink: 0; }
.pill .ab { font-weight: 600; color: #475569; }
.mx-scale { position: absolute; z-index: 50; top: 89px; right: 10px; width: 760px; max-height: calc(100% - 100px); overflow-y: auto; background: #fff; border: 1px solid rgba(15,23,42,.1); border-radius: 10px; box-shadow: 0 12px 40px rgba(15,23,42,.16), 0 1px 2px rgba(15,23,42,.06); padding: 14px 20px 12px; }

  h += list.length ? `<div class="mx-cards nt-grid">${list.map(n => pubCard(n, ro)).join("")}</div>` : `<div class="mx-empty-state" style="margin:0;max-width:none"><b>Nothing to show</b>The Authors filter hides every published note.</div>`;
  return `<div class="nt-page">${h}</div>`;
}

function diffCard(r, i) {
  const n = r.b || r.a, k = { a: "a", c: "c", r: "r" }[r.k], hl = i >= 0 && i === S.stepIdx ? " fresh" : "";
  const body = r.k === "c" && r.a && r.b ? `<div class="nt-body">${wdiff(r.a.body, r.b.body)}</div>` : r.k === "r" ? `<div class="nt-body nt-gone">${esc(n.body)}</div>` : `<div class="nt-body">${esc(n.body)}</div>`;
  return `<article class="mx-card nt-card${r.k === "u" ? "" : " k-" + r.k}${hl}" data-note="${r.id}"><div class="mx-card-head"><b>${esc(PEOPLE[n.writer].name)}</b><span>${when((r.b || r.a).t)}</span></div>${r.k === "u" ? "" : `<span class="nt-kind ${KIND[k][0]}">${{ a: "added", c: "changed", r: "deleted" }[r.k]}</span>`}${body}</article>`;
}
function cmpScene() {
  const rows = cmpRows(), ch = rows.filter(r => r.k !== "u"), A = revInForce(S.from), B = revInForce(S.at || nowT());
  const head = (v, tag) => `<div class="mx-card nt-revision"><div class="nt-head"><b>${tag ? tag + " · " : ""}v${v.n} · ${esc(v.title)}</b><span>${esc(PEOPLE[v.who].name)} published it ${when(v.t)} · read only</span></div></div>`;
  if (S.mode === "split") {
    const col = (side, v) => `<div class="nt-page" style="position:static;width:580px">${head(v, side.toUpperCase())}<div class="mx-cards nt-grid" style="grid-template-columns:repeat(2,280px)">${rows.filter(r => side === "a" ? r.a : r.b).map(r => diffCard(side === "a" ? { ...r, b: null, k: r.k === "a" ? "u" : r.k === "c" ? "u" : r.k } : { ...r, a: r.k === "c" ? r.a : null }, ch.indexOf(r))).join("")}</div></div>`;
    return `<div style="position:absolute;left:0;top:0;display:flex;gap:40px">${col("a", A)}${col("b", B)}</div>`;
  }
  return `<div class="nt-page"><div class="mx-card nt-revision"><div class="nt-head"><b>v${A.n} → v${B.n}</b><span>${ch.length} ${ch.length === 1 ? "change" : "changes"} · read only</span></div></div><div class="mx-cards nt-grid">${rows.map(r => diffCard(r, ch.indexOf(r))).join("")}</div></div>`;
}

/* The words that changed, inside the one text: struck red what went, green what came — as the first version of this mockup. */
function wdiff(a, b) {
  const x = a.split(/(\s+)/), y = b.split(/(\s+)/), n = x.length, m = y.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "";
  const del = t => `<span class="nt-del">${esc(t)}</span>`, ins = t => `<span class="nt-ins">${esc(t)}</span>`;
  while (i < n && j < m) { if (x[i] === y[j]) { out += esc(x[i]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out += del(x[i++]); else out += ins(y[j++]); }
  while (i < n) out += del(x[i++]);
  while (j < m) out += ins(y[j++]);
  return out;
}

const listRow = d => { const b = baseNote(d); return `<div>${kindSpan(d.k)}<span>${esc(d.k === "r" ? b.body : d.body)}</span></div>`; };
const SAY = {

  cd: w => [`You changed it; ${w} deleted it.`, "Restore it with mine", "Leave it deleted", "The note comes back with your text."],
  dc: w => [`You deleted it; ${w} changed it.`, "Delete it anyway", `Keep ${w}'s`, `The note is deleted, ${w}'s change with it.`],

function conflictHtml(d) {

    <div class="nt-choice"><button type="button" class="${ch === "over" ? "on" : ""}" onclick="top.choose('${d.id}','over')">${over}</button><button type="button" class="${ch === "give" ? "on" : ""}" onclick="top.choose('${d.id}','give')">${give}</button>${res ? `<span>${res}</span>` : ""}</div></div>`;
}
function dialogHtml() {

/* The canvas as @maxitor/panel's: the wheel moves, Ctrl or ⌘ with the wheel zooms, dragging moves, ⊡ fits. */
function bindCanvas() {
  const { pd } = DEV, win = pd.defaultView, cv = pd.querySelector(".mx-canvas"), scene = pd.querySelector(".mx-canvas-scene"), val = pd.querySelector(".mx-bar-value");
  const page = scene.firstElementChild, key = S.page + (S.at || "");
  const phone = win.innerWidth <= 520, left = phone ? 12 : 148 + 24, topY = 28 + 24, area = win.innerWidth - left - 12;
  const fitCam = () => { const k = Math.max(.25, Math.min(1, area / page.offsetWidth)); return { k, x: left + Math.max(0, (area - page.offsetWidth * k) / 2), y: topY }; };
  const cam = DEV.cam[key] || (DEV.cam[key] = fitCam());
  const apply = () => { scene.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.k})`; cv.style.backgroundPosition = `${cam.x}px ${cam.y}px`; cv.style.backgroundSize = `calc(var(--mx-dot-step) * ${cam.k}) calc(var(--mx-dot-step) * ${cam.k})`; val.textContent = Math.round(cam.k * 100) + "%"; };
  const zoomAt = (mx, my, f) => { const nk = Math.min(2.5, Math.max(.2, cam.k * f)); cam.x = mx - (mx - cam.x) * nk / cam.k; cam.y = my - (my - cam.y) * nk / cam.k; cam.k = nk; apply(); };
  if (S.stepIdx !== null) { const r = rowsNow().filter(x => x.k !== "u")[S.stepIdx], el = r && scene.querySelector(`[data-note="${r.id}"]`); if (el) { cam.x = win.innerWidth / 2 - (el.offsetLeft + el.offsetWidth / 2) * cam.k; cam.y = win.innerHeight / 3 - el.offsetTop * cam.k; } }
  apply();
  cv.onwheel = e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) return zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0045)); cam.x -= e.deltaX; cam.y -= e.deltaY; apply(); };
  let drag = null;
  cv.onpointerdown = e => { if (e.target.closest("button, textarea, input, .nt-mark")) return; drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; };
  win.onpointermove = e => { if (!drag) return; cam.x = drag.cx + e.clientX - drag.x; cam.y = drag.cy + e.clientY - drag.y; apply(); };
  win.onpointerup = () => { drag = null; };
  pd.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { const w = win.innerWidth / 2, h = win.innerHeight / 2; if (b.dataset.z === "in") zoomAt(w, h, 1.2); else if (b.dataset.z === "out") zoomAt(w, h, 1 / 1.2); else { Object.assign(cam, fitCam()); apply(); } });
}

  "1.6": ["Revert", ["Revert asks first. A changed or deleted note gives up Anna's change and leaves the draft: the note stays as v6 has it. A new note is removed — it was never published."]],
  "1.7": ["Someone published over my base", ["Olga published v7 at 11:05, after the v6 Anna's draft was made over. The draft says so and rings the three changes that meet Olga's: nothing is lost, Anna chooses for each one when she publishes."]],
  "1.8": ["An empty draft", ["Nothing of Anna's waits. The empty state leads her to write or to change a published note."]],
  "1.9": ["Publish with an empty draft", ["Publish stays in its place; with nothing to publish it says so in words — the server's refusal <code>nothing_to_publish</code>."]],
  "2.1": ["Everyone's published notes", ["<b>Published</b> shows the notes of all authors as the revision in force holds them: v6. It is read only: nobody types into it.", "The filter is <b>Authors</b>, with each person's initials in their colour, as on the template's notes page.", "A card's Edit and Delete act <b>in my draft</b>: anyone may change and delete anyone's published note, but only through their own draft.", "A note already in Anna's draft is marked <b>In your draft: changed / deleted</b>, which leads to Draft. The head says how many changes wait in her draft."]],
  "2.2": ["The Authors filter", ["Only Olga's notes are left."]],
  "2.3": ["Changing someone's note", ["Edit on Olga's note opens Draft with the note as a <b>changed</b> card already being edited, over v6. Cancel, if the text was not touched, takes it out of the draft again."]],
  "2.4": ["Deleting in my draft", ["Delete does not delete anything for others: the deletion waits in Anna's draft, and the card is marked <b>In your draft: deleted</b>."]],
  "3.1": ["Publish without conflicts", ["Nobody published since v6, so every change goes in as it is. The whole draft is published as one revision v7, with a title, a comment and an optional release — the milestone on the time scale."]],
  "3.2": ["Published as v7", ["Published shows v7 for everyone; the draft starts empty."]],
  "3.3": ["Conflicts", ["Olga's v7 came after Anna's base v6, and three of Anna's changes touch the same notes. Each shows <b>Yours</b> and <b>Olga's</b> one above the other.", "Three kinds: both changed it; Anna changed it and Olga deleted it (overwriting <b>restores</b> the note); Anna deleted it and Olga changed it (overwriting deletes it with her change).", "Anna chooses for each: overwrite with hers, or give hers up. The two changes nobody else touched go in without a question. Publish is off until each is chosen."]],
  "3.4": ["Chosen for each note", ["Two are overwritten, one is given up; the foot says so and Publish is on."]],
  "3.5": ["Published as v8", ["v8 holds Anna's text for the settlement note, the chargebacks note restored with her text, and Olga's partial-refunds note: Anna gave up her deletion, and it is gone from the draft."]],
  "4.1": ["The time scale", ["The core's pill and its scale, as the accepted mockup of spec 074 draws them: a revision is a milestone on the lane, Anna's draft waits as the dashed amber point at now; ‹ › step from revision to revision; One, Diff and Side by side choose one moment or two."]],
  "4.1a": ["The scale on Draft", ["The same scale. Draft offers one moment only: at a chosen moment it shows Anna's own draft then."]],
  "4.5": ["Comparing two revisions", ["Diff of v6 and v7 on Published: what Olga's revision changed. The page's actions are gone — in the past and in a comparison everything is read only — and in their place, top right, stands the core's change stepper: ‹ 3 changes ›. The two never stand together, so they never overlap."]],
  "4.6": ["The stepper's list", ["The stepper opens the list of the changes, as maxitor-web's ChangeStepper does on the graph: + added, ~ changed, − deleted."]],
  "4.7": ["A chosen change", ["A change chosen in the list or with ‹ › is brought into view and ringed."]],
  "4.8": ["Side by side", ["A and B, each with its revision's head."]],
  "4.2": ["My draft in the past", ["At 10:20 Anna's draft held the two changes she had made by then. Draft in the past shows only her own draft at that moment, read only: no actions, no tools."]],
  "4.3": ["Published in the past", ["At 9 Nov, 17:30 the revision in force was v5: Published shows everyone's notes as v5 holds them."]],
  "4.4": ["My previous draft", ["At 9 Nov, 17:30 Anna's draft held the sandbox note, which she published the next morning as v6."]],
  "5.1": ["Draft on a phone", ["The phone layout is production's too: the tree behind ☰, the filters behind their button, the actions above the bottom bar, a card's tools behind ⋯."]],
  "5.2": ["A change's actions", ["⋯ opens the shell's dialog as a sheet: Edit and Revert."]],
  "5.3": ["Conflicts on a phone", ["The dialog is a sheet; the choice is two wide buttons."]],
  "5.4": ["Published on a phone", ["Everyone's notes; ⋯ has Edit in my draft and Delete in my draft."]],
  "5.5": ["The filters on a phone", ["The shell's filter sheet with Done."]],
  "5.6": ["The tree on a phone", ["The core's drawer."]],
};
const PATHS = [
  ["Change, publish, conflict", "Anna changes notes, Olga publishes first, Anna chooses", [["My draft", "1.1"], ["Olga published", "1.7"], ["Conflicts", "3.3"], ["Chosen", "3.4"], ["v8", "3.5"]]],
  ["Someone's note", "Anna changes Olga's note through her draft", [["Published", "2.1"], ["Edit", "2.3"], ["Publish", "3.1"], ["v7", "3.2"]]],
];
function base(o) { const s = JSON.parse(JSON.stringify(DEF)); Object.assign(s, JSON.parse(JSON.stringify(o))); return s; }
function openNum(n) {
  for (const [, items] of SCREENS) for (const [k, , st, fn] of items) if (k === n) {
    const ph = S.phone;
    for (const key of Object.keys(S)) delete S[key];
    Object.assign(S, base(st)); if (!("phone" in st) && !n.startsWith("5.")) S.phone = ph;
    if (DEV) DEV.cam = {};
    HV.ymax = 0; fitAll(false);
    if (fn) fn(); render(); CUR = n; renderNav(); renderNotes(); return;
  }
}
function renderNav() {
  let h = `<h1>Plugin template: my draft over everyone's published notes</h1><div class="sub">The screens of issue #121, drawn with the production frame, shell and CSS of Maxitor. Draft is mine alone, Published is everyone's; the whole draft is published as one revision, and a change that meets someone else's is overwritten or given up.</div>`;
  h += `<div class="seg"><button class="${S.phone ? "" : "on"}" onclick="go({phone:false,drawer:false,fopen:false})">Desktop</button><button class="${S.phone ? "on" : ""}" onclick="go({phone:true})">Phone</button></div>`;
  for (const [g, items] of SCREENS) { h += `<div class="group">${g}</div>`; for (const [n, t] of items) h += `<button class="screen${CUR === n ? " on" : ""}" onclick="openNum('${n}')"><span class="n">${n}</span>${t}</button>`; }
  h += `<div class="group">Paths</div>`;
  for (const [t, f, steps] of PATHS) h += `<div class="path"><div class="pt">${t}</div><div class="pf">${f}</div><div class="steps">${steps.map(([s, n], i) => `${i ? "<span>→</span>" : ""}<button onclick="openNum('${n}')">${s}</button>`).join("")}</div></div>`;
  document.getElementById("nav").innerHTML = h;
}
function renderNotes() {
  const note = NOTES[CUR], dev = S.phone ? "phone, 375 × 812" : "desktop, 1360 × 840";
  document.getElementById("cap").innerHTML = note ? `<b>${CUR} · ${note[0]}</b> — ${dev}, the screen is live` : `Free navigation through the mockup — ${dev}`;
  document.getElementById("notes").innerHTML = note ? `<h2>${CUR} · ${note[0]}</h2><ul>${note[1].map(x => `<li>${x}</li>`).join("")}</ul>` : `<h2>Free navigation</h2><ul><li>You got here by moving through the screens themselves: what you write, change, revert and publish is read back on both pages and at every moment.</li></ul>`;
}
function fit() {
  const stage = document.getElementById("stage"), sc = document.getElementById("scale"), box = document.getElementById("box");
  const w = S.phone ? 375 : 1360, h = S.phone ? 812 : 840, k = Math.min(1, (stage.clientWidth - (stage.style.padding === "0px" ? 0 : 48)) / w);
  sc.style.transform = `scale(${k})`; box.style.height = h * k + "px";
}
window.addEventListener("resize", fit);
/* An address like #3.3 opens that screen; #3.3-phone opens its phone version; #bare hides the navigator and the notes. */
(function fromHash() {
  const h = location.hash.slice(1), m = h.match(/(\d+\.\d+a?)/);
  if (h.includes("bare")) { for (const id of ["nav", "notes", "cap"]) document.getElementById(id).style.display = "none"; document.getElementById("stage").style.padding = "0"; }
  S.phone = h.includes("phone");
  openNum(m ? m[1] : "1.1");
})();

</script>
